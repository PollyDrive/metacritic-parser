# Пропускаем pipeline если коммит помечен [skip ci]
workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - when: always

stages:
  - check
  - build
  - deploy

variables:
  APP_IMAGE: $CI_REGISTRY_IMAGE:latest

# ── Базовый шаблон для check-джобов ────────────────────────────────────────
.check_base: &check_base
  stage: check
  image: python:3.12-slim
  interruptible: true
  variables:
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  before_script:
    - pip install --quiet poetry==2.2.1
  only:
    - main

# 1a. Линтер + tach (границы DDD-слоёв)
lint:
  <<: *check_base
  cache:
    key:
      files: [poetry.lock]
      prefix: lint-dev
    paths:
      - .pip-cache/
      - .venv/
  script:
    - poetry install --only dev --no-root --quiet
    - poetry run ruff check .
    - poetry run tach check

# 1b. Тесты
test:
  <<: *check_base
  cache:
    key:
      files: [poetry.lock]
      prefix: test-all
    paths:
      - .pip-cache/
      - .venv/
  script:
    - poetry install --no-root --quiet
    - poetry run pytest tests/ --tb=short -q

# 2. Сборка образа через Docker-in-Docker.
# Раннер БЕЗ тегов → любой shared-раннер с поддержкой dind. Privileged нужен
# в конфиге раннера (executor), не как тег джоба.
build:
  stage: build
  image: docker:24.0.5
  interruptible: true
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $APP_IMAGE || true
    - docker build
        --cache-from $APP_IMAGE
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t $APP_IMAGE
        .
    - docker push $APP_IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 3. Деплой на сервер (podman compose, rootless). Сервер пуллит образ из реестра.
# Переменные в GitLab CI/CD Settings:
#   SSH_PRIVATE_KEY, SERVER_IP, SERVER_USER, SERVER_PORT, DEPLOY_DIR=/home/<user>/projects/metacritic-game-tracker
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - |
      set -e
      if [ -z "$SERVER_IP" ] || [ -z "$SERVER_USER" ] || [ -z "$DEPLOY_DIR" ]; then
        echo "CRITICAL ERROR: SERVER_IP, SERVER_USER or DEPLOY_DIR is not defined."
        exit 1
      fi
      eval $(ssh-agent -s)
      echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts || echo "Warning: ssh-keyscan failed"
  script:
    - |
      echo "Генерация .env из переменных GitLab CI..."
      env | grep -E '^(DATABASE_URL|POSTGRES_|APP_ENV|OPENCODE_)' > .env.deploy || true
    - ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" $SERVER_USER@$SERVER_IP "mkdir -p $DEPLOY_DIR/logs"
    - scp -o StrictHostKeyChecking=no -P "$SERVER_PORT" .env.deploy $SERVER_USER@$SERVER_IP:$DEPLOY_DIR/.env
    - ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" $SERVER_USER@$SERVER_IP "chmod 600 $DEPLOY_DIR/.env && chmod 777 $DEPLOY_DIR/logs"
    - ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" $SERVER_USER@$SERVER_IP
        "cd $DEPLOY_DIR && find . -maxdepth 1 ! -name '.' ! -name '.env' ! -name 'logs' ! -name 'docker-compose.yml' ! -name 'scripts' -exec rm -rf {} +"
    - rsync -az -e "ssh -o StrictHostKeyChecking=no -p $SERVER_PORT"
        docker-compose.yml scripts/ $SERVER_USER@$SERVER_IP:$DEPLOY_DIR/
    - |
      ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" $SERVER_USER@$SERVER_IP "
        set -e
        cd $DEPLOY_DIR
        export XDG_RUNTIME_DIR=\"/run/user/\$(id -u)\"
        export DOCKER_HOST=\"unix://\$XDG_RUNTIME_DIR/podman/podman.sock\"
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        export DOCKER_CONFIG=\"\$HOME/.docker\"
        mkdir -p \"\$DOCKER_CONFIG\"
        podman system service --time 30 >/dev/null 2>&1 </dev/null &
        PODMAN_PID=$!
        sleep 5
        podman login --authfile \"\$DOCKER_CONFIG/config.json\" -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        podman compose pull
        podman compose up -d --force-recreate
        sleep 15
        podman ps -a
        podman image prune -f
        kill $PODMAN_PID 2>/dev/null || true
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: build
      optional: true
