[tool.poetry]
name = "metacritic-game-tracker"
version = "0.1.0"
description = "Hourly Metacritic scraper + catalog web UI"
authors = []
packages = [{ include = "metacritic_game_tracker" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
SQLAlchemy = {version = "^2.0.29", extras = ["asyncio"]}
asyncpg = "^0.30.0"
alembic = "^1.13.1"
pydantic = "^2.6.1"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
selectolax = "^0.3.21"
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
jinja2 = "^3.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pytest-asyncio = "^0.23.5"
ruff = "^0.4.0"
tach = "^0.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM117"]
