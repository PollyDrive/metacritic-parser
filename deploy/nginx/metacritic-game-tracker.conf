upstream metacritic_upstream {
    server 127.0.0.1:8089;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Auth только для /monitoring/* — FastAPI сам проверяет Basic Auth
    # Nginx просто проксирует, не дублирует логику авторизации
    location / {
        proxy_pass http://metacritic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-совместимость: отключаем буферизацию для /monitoring/stream
        proxy_buffering off;
        proxy_cache off;
    }

    location /monitoring/stream {
        proxy_pass http://metacritic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://metacritic_upstream/healthz;
    }
}
