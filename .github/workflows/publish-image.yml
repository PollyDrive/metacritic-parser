name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Lint (Tach)
        run: poetry run tach check

      - name: Test
        run: poetry run pytest tests/ --tb=short -q

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/metacritic-game-tracker" >> "$GITHUB_OUTPUT"

      - name: Set tags
        id: tags
        run: |
          TAGS="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA},${{ steps.image.outputs.name }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  deploy-vps:
    runs-on: ubuntu-latest
    needs: publish
    env:
      APP_IMAGE: ${{ vars.APP_IMAGE || needs.publish.outputs.image }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '~/metacritic-game-tracker' }}
      APP_HOST_PORT: ${{ vars.APP_HOST_PORT || '8089' }}
      DB_HOST_PORT: ${{ vars.DB_HOST_PORT || '5440' }}
    steps:
      - name: Check VPS secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "VPS_APP_DIR=${VPS_APP_DIR:-~/metacritic-game-tracker}" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets not fully configured — skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Render docker-compose for VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p .deploy-rendered
          python3 - <<PY
          import os, re
          from pathlib import Path

          image = os.getenv("APP_IMAGE", "ghcr.io/krvtzz/metacritic-game-tracker:latest")
          app_port = os.getenv("APP_HOST_PORT", "8089")
          db_port = os.getenv("DB_HOST_PORT", "5440")

          content = Path("docker-compose.yml").read_text()

          # Подставляем образ из GHCR вместо CI_REGISTRY_IMAGE
          content = re.sub(
              r'image:\s*\$\{CI_REGISTRY_IMAGE[^}]*\}[^\n]*',
              f'image: {image}',
              content
          )
          # Убираем build: . — на VPS исходников нет
          content = re.sub(r'^\s*build:\s*\.\s*\n', '', content, flags=re.MULTILINE)
          # Убираем .:/app volume — на VPS только ./logs нужен
          content = re.sub(r'^\s*-\s*\.:/app\s*\n', '', content, flags=re.MULTILINE)
          # Порты: только на 127.0.0.1 (nginx реверс-прокси)
          # В docker-compose.yml APP_HOST_PORT уже имеет префикс 127.0.0.1:, поэтому не дублируем его
          content = re.sub(r'\$\{APP_HOST_PORT:-\d+\}', app_port, content)
          content = re.sub(r'\$\{DB_HOST_PORT:-\d+\}', f'127.0.0.1:{db_port}', content)
          # Фоллбэк для хардкоженных значений
          content = content.replace('- "8001:8000"', f'- "127.0.0.1:{app_port}:8080"')
          content = content.replace('- "5440:5432"', f'- "127.0.0.1:{db_port}:5432"')

          Path(".deploy-rendered/docker-compose.yml").write_text(content)
          print(f"Rendered: image={image}, app={app_port}, db={db_port}")
          PY
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          APP_HOST_PORT: ${{ env.APP_HOST_PORT }}
          DB_HOST_PORT: ${{ env.DB_HOST_PORT }}

      - name: Copy deploy files to VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Only these two — both under .deploy-rendered/, same path depth,
          # so strip_components:1 is unambiguous. scripts/ used to ride
          # along here too (1 path component vs these two's 2), which is
          # exactly the kind of heterogeneous-depth multi-source scp that
          # broke silently: docker-compose.yml on the VPS stayed the old
          # unrendered file (image: metacritic-game-tracker-app, the bare
          # fallback with no registry) even though the render step upstream
          # computed the right ghcr.io image every time — nothing here ever
          # consumes scripts/ from the host anyway: migrate.py runs via
          # `docker compose exec app python scripts/migrate.py`, out of the
          # image's own copy, not this checkout's.
          source: ".deploy-rendered/docker-compose.yml"
          target: ${{ env.VPS_APP_DIR }}

      - name: Deploy on VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,GH_TOKEN,GH_ACTOR
          script: |
            set -e
            APP_DIR="${VPS_APP_DIR:-~/metacritic-game-tracker}"
            mkdir -p "$APP_DIR/logs"
            chmod 777 "$APP_DIR/logs"

            # .env из CI заменяет старый, только если был передан
            if [ -f "$APP_DIR/.env" ] && [ -s "$APP_DIR/.env" ]; then
              chmod 600 "$APP_DIR/.env"
            fi


            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            cd "$APP_DIR"
            
            if [ -f ".deploy-rendered/docker-compose.yml" ]; then
              mv .deploy-rendered/docker-compose.yml docker-compose.yml
              rm -rf .deploy-rendered
            else
              echo "ERROR: .deploy-rendered/docker-compose.yml not found on VPS!"
              exit 1
            fi

            # Clean stray files from past deploys (e.g. migrate.py/
            # run_scheduler.py that used to land bare in this dir from the
            # old scripts/ scp source) — whitelist, not blacklist, so a
            # future accidental extra source doesn't linger silently again.
            # backup.sh is left alone: nothing in this pipeline creates it,
            # so it's presumably placed here deliberately, not deploy debris.
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.env' ! -name 'docker-compose.yml' \
              ! -name 'logs' ! -name 'nginx' ! -name 'backup.sh' \
              -exec rm -rf {} +

            echo "Deployed compose image line:"
            grep -A1 '^  app:' docker-compose.yml | grep image:

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --force-recreate

            # Ждём готовности DB: pg_isready в цикле (до 90 секунд).
            # sleep 10 не хватает при первом запуске — postgres инициализирует
            # data directory, это занимает 30–60 секунд.
            DB_USER="${POSTGRES_USER:-postgres}"
            DB_READY=0
            for i in $(seq 1 45); do
              if docker compose -f docker-compose.yml exec -T db \
                   pg_isready -U "$DB_USER" -q 2>/dev/null; then
                DB_READY=1
                echo "DB ready after $((i * 2))s"
                break
              fi
              sleep 2
            done
            if [ "$DB_READY" -ne 1 ]; then
              echo "ERROR: DB did not become ready in 90s" >&2
              exit 1
            fi

            # Миграции: idempotent, безопасно при повторных запусках
            docker compose -f docker-compose.yml exec -T app \
              python scripts/migrate.py

            
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            docker image prune -f
