name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Lint (Tach)
        run: poetry run tach check

      - name: Test
        run: poetry run pytest tests/ --tb=short -q

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/metacritic-game-tracker" >> "$GITHUB_OUTPUT"

      - name: Set tags
        id: tags
        run: |
          TAGS="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA},${{ steps.image.outputs.name }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  deploy-vps:
    runs-on: ubuntu-latest
    needs: publish
    env:
      APP_IMAGE: ${{ vars.APP_IMAGE || needs.publish.outputs.image }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/krvtzz/projects/metacritic-game-tracker' }}
      # Порт на хосте — переопределяется через GitHub Actions Variable APP_HOST_PORT
      # Дефолт 8001 для обратной совместимости
      APP_HOST_PORT: ${{ vars.APP_HOST_PORT || '8001' }}
      DB_HOST_PORT: ${{ vars.DB_HOST_PORT || '5440' }}
    steps:
      - name: Check VPS secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets not fully configured — skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Render docker-compose for VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p .deploy-rendered
          python3 - <<PY
          import os, re
          from pathlib import Path

          image = os.getenv("APP_IMAGE", "ghcr.io/krvtzz/metacritic-game-tracker:latest")
          app_port = os.getenv("APP_HOST_PORT", "8001")
          db_port = os.getenv("DB_HOST_PORT", "5440")

          content = Path("docker-compose.yml").read_text()

          # Подставляем образ из GHCR вместо CI_REGISTRY_IMAGE
          content = re.sub(
              r'image:\s*\$\{CI_REGISTRY_IMAGE[^}]*\}[^\n]*',
              f'image: {image}',
              content
          )
          # Убираем build: . — на VPS исходников нет
          content = re.sub(r'^\s*build:\s*\.\s*\n', '', content, flags=re.MULTILINE)
          # Убираем .:/app volume — на VPS только ./logs нужен
          content = re.sub(r'^\s*-\s*\.:/app\s*\n', '', content, flags=re.MULTILINE)

          # nginx: порты только на 127.0.0.1 (не наружу)
          # Заменяем APP_HOST_PORT и DB_HOST_PORT на конкретные значения из env
          content = re.sub(
              r'\$\{APP_HOST_PORT:-\d+\}',
              f'127.0.0.1:{app_port}',
              content
          )
          content = re.sub(
              r'\$\{DB_HOST_PORT:-\d+\}',
              f'127.0.0.1:{db_port}',
              content
          )
          # На случай если порты уже хардкожены (старые версии compose)
          content = content.replace('- "8001:8000"', f'- "127.0.0.1:{app_port}:8000"')
          content = content.replace('- "5440:5432"', f'- "127.0.0.1:{db_port}:5432"')

          Path(".deploy-rendered/docker-compose.yml").write_text(content)
          print(f"Rendered with APP_HOST_PORT={app_port}, DB_HOST_PORT={db_port}, image={image}")
          PY
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          APP_HOST_PORT: ${{ env.APP_HOST_PORT }}
          DB_HOST_PORT: ${{ env.DB_HOST_PORT }}

      - name: Copy deploy files to VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".deploy-rendered/docker-compose.yml,scripts/"
          target: ${{ env.VPS_APP_DIR }}
          strip_components: 1

      - name: Pull and restart on VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,GH_TOKEN,GH_ACTOR
          script: |
            APP_DIR="${VPS_APP_DIR:-/home/krvtzz/projects/metacritic-game-tracker}"
            mkdir -p "$APP_DIR/logs"
            chmod 777 "$APP_DIR/logs"

            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/podman/podman.sock"

            echo "$GH_TOKEN" | podman login ghcr.io -u "$GH_ACTOR" --password-stdin

            cd "$APP_DIR"

            podman compose -f docker-compose.yml pull
            podman compose -f docker-compose.yml up -d --force-recreate

            sleep 10
            podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            podman image prune -f
