name: Publish Docker Image

on:
  push:
    branches:
      - main
      - preprod
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Lint (Tach)
        run: poetry run tach check

      - name: Test
        run: poetry run pytest tests/ --tb=short -q

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/metacritic-game-tracker" >> "$GITHUB_OUTPUT"

      - name: Set tags
        id: tags
        run: |
          TAGS="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA},${{ steps.image.outputs.name }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  deploy-vps:
    runs-on: ubuntu-latest
    needs: publish
    env:
      APP_IMAGE: ${{ vars.APP_IMAGE || needs.publish.outputs.image }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '~/metacritic-game-tracker' }}
      APP_HOST_PORT: ${{ vars.APP_HOST_PORT || '8089' }}
      DB_HOST_PORT: ${{ vars.DB_HOST_PORT || '5440' }}
    steps:
      - name: Check VPS secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "VPS_APP_DIR=${VPS_APP_DIR:-~/metacritic-game-tracker}" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets not fully configured — skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Render docker-compose for VPS
        if: steps.check.outputs.configured == 'true'
        id: render
        run: |
          mkdir -p .deploy-rendered
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          image = os.getenv("APP_IMAGE", "ghcr.io/krvtzz/metacritic-game-tracker:latest")
          app_port = os.getenv("APP_HOST_PORT", "8089")
          db_port = os.getenv("DB_HOST_PORT", "5440")

          content = Path("docker-compose.yml").read_text()

          # Подставляем образ из GHCR вместо CI_REGISTRY_IMAGE
          content = re.sub(
              r'image:\s*\$\{CI_REGISTRY_IMAGE[^}]*\}[^\n]*',
              f'image: {image}',
              content
          )
          # Убираем build: . — на VPS исходников нет
          content = re.sub(r'^\s*build:\s*\.\s*\n', '', content, flags=re.MULTILINE)
          # Убираем .:/app volume — на VPS только ./logs нужен
          content = re.sub(r'^\s*-\s*\.:/app\s*\n', '', content, flags=re.MULTILINE)
          # Порты: только на 127.0.0.1 (nginx реверс-прокси). App-порт в
          # docker-compose.yml уже жёстко привязан к 127.0.0.1 в самой
          # строке — тут просто подставляем номер порта, а не добавляем
          # префикс повторно (иначе получаем невалидный
          # "127.0.0.1:127.0.0.1:8089:8080"). DB-порт такого префикса в
          # исходнике не имеет — добавляем его здесь.
          content = re.sub(r'\$\{APP_HOST_PORT:-\d+\}', app_port, content)
          content = re.sub(r'\$\{DB_HOST_PORT:-\d+\}', f'127.0.0.1:{db_port}', content)
          # Фоллбэк для хардкоженных значений
          content = content.replace('- "8001:8000"', f'- "127.0.0.1:{app_port}:8080"')
          content = content.replace('- "5440:5432"', f'- "127.0.0.1:{db_port}:5432"')

          Path(".deploy-rendered/docker-compose.yml").write_text(content)
          print(f"Rendered: image={image}, app={app_port}, db={db_port}")
          PY

          echo "Rendered app: image line:"
          grep -A1 '^  app:' .deploy-rendered/docker-compose.yml | grep 'image:'

          # Passed to the SSH step as an env var rather than scp'd + moved on
          # the VPS — fewer moving parts, and this was never actually where
          # the bug was (root cause: the heredoc above used to be an
          # unquoted `<<PY`, so bash expanded every `\$` in the Python
          # source before python ever saw it, silently turning the `\$` in
          # each regex into a bare `$` — a real content mismatch, not a
          # transport one. Every scp/strip_components/mv fix attempt before
          # this one was chasing the wrong layer).
          {
            echo 'content_b64<<COMPOSE_EOF'
            base64 -w0 .deploy-rendered/docker-compose.yml
            echo
            echo 'COMPOSE_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          APP_HOST_PORT: ${{ env.APP_HOST_PORT }}
          DB_HOST_PORT: ${{ env.DB_HOST_PORT }}

      - name: Render .env for VPS
        if: steps.check.outputs.configured == 'true'
        id: render_env
        run: |
          # Same env-var-pipe pattern as docker-compose.yml above, for the
          # same reason: no scp, no intermediate file on the VPS to land
          # wrong. This step existed before, got dropped along with the
          # nginx scp step, and nothing replaced it — MONITORING_USERNAME/
          # PASSWORD (and everything else here) stopped reaching the VPS
          # entirely, silently, since docker compose just keeps whatever
          # .env was already there rather than erroring on a missing one.
          cat > /tmp/deploy.env <<'ENVEOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'metacritic_game_tracker_db' }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER || 'postgres' }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB || 'metacritic_game_tracker_db' }}
          OPENCODE_BASE_URL=${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_API_KEY=${{ secrets.OPENCODE_API_KEY }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          MONITORING_USERNAME=${{ secrets.MONITORING_USERNAME }}
          MONITORING_PASSWORD=${{ secrets.MONITORING_PASSWORD }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
          APP_ENV=prod
          LOGS_DIR=logs
          APP_PORT=8080
          ENVEOF
          {
            echo 'content_b64<<ENV_EOF'
            base64 -w0 /tmp/deploy.env
            echo
            echo 'ENV_EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f /tmp/deploy.env

      - name: Deploy on VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RENDERED_COMPOSE_B64: ${{ steps.render.outputs.content_b64 }}
          RENDERED_ENV_B64: ${{ steps.render_env.outputs.content_b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,GH_TOKEN,GH_ACTOR,RENDERED_COMPOSE_B64,RENDERED_ENV_B64
          script: |
            set -e
            APP_DIR="${VPS_APP_DIR:-~/metacritic-game-tracker}"
            mkdir -p "$APP_DIR/logs"
            chmod 777 "$APP_DIR/logs"

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            cd "$APP_DIR"

            # Written directly from env vars, not scp'd + moved — see the
            # render step's comment for why.
            if [ -z "$RENDERED_COMPOSE_B64" ]; then
              echo "ERROR: RENDERED_COMPOSE_B64 was empty!" >&2
              exit 1
            fi
            echo "$RENDERED_COMPOSE_B64" | base64 -d > docker-compose.yml

            if [ -z "$RENDERED_ENV_B64" ]; then
              echo "ERROR: RENDERED_ENV_B64 was empty!" >&2
              exit 1
            fi
            echo "$RENDERED_ENV_B64" | base64 -d > .env
            chmod 600 .env
            rm -rf .deploy-rendered

            # Clean stray files from past deploys (e.g. migrate.py/
            # run_scheduler.py that used to land bare in this dir from the
            # old scripts/ scp source) — whitelist, not blacklist, so a
            # future accidental extra source doesn't linger silently again.
            # backup.sh is left alone: nothing in this pipeline creates it,
            # so it's presumably placed here deliberately, not deploy debris.
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.env' ! -name 'docker-compose.yml' \
              ! -name 'logs' ! -name 'nginx' ! -name 'backup.sh' \
              -exec rm -rf {} +

            echo "Deployed compose image line:"
            grep -A1 '^  app:' docker-compose.yml | grep image:

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --force-recreate

            # Ждём готовности DB: pg_isready в цикле (до 90 секунд).
            # sleep 10 не хватает при первом запуске — postgres инициализирует
            # data directory, это занимает 30–60 секунд.
            DB_USER="${POSTGRES_USER:-postgres}"
            DB_READY=0
            for i in $(seq 1 45); do
              if docker compose -f docker-compose.yml exec -T db \
                   pg_isready -U "$DB_USER" -q 2>/dev/null; then
                DB_READY=1
                echo "DB ready after $((i * 2))s"
                break
              fi
              sleep 2
            done
            if [ "$DB_READY" -ne 1 ]; then
              echo "ERROR: DB did not become ready in 90s" >&2
              exit 1
            fi

            # Миграции: idempotent, безопасно при повторных запусках
            docker compose -f docker-compose.yml exec -T app \
              python scripts/migrate.py

            # NOW safe to delete — every `docker compose` invocation this
            # run is done. Earlier attempt deleted .env right after `up -d`
            # and broke everything after it: `docker compose` (exec, pull,
            # ps — any subcommand) re-reads docker-compose.yml on every
            # invocation and needs the env_file it references to actually
            # exist on disk, even just to exec into an already-running
            # container — it's not only consulted at container-create time.
            rm -f .env

            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            docker image prune -f
