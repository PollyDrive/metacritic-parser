name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Lint (Tach)
        run: poetry run tach check

      - name: Test
        run: poetry run pytest tests/ --tb=short -q

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/metacritic-game-tracker" >> "$GITHUB_OUTPUT"

      - name: Set tags
        id: tags
        run: |
          TAGS="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA},${{ steps.image.outputs.name }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  deploy-vps:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref_name == 'main'
    env:
      APP_IMAGE: ${{ vars.APP_IMAGE }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
    steps:
      - name: Check VPS secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets not fully configured, skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Render deploy files
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p .deploy-rendered
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          export DEFAULT_APP_IMAGE="ghcr.io/$OWNER/metacritic-game-tracker:latest"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          defaults = {
              "APP_IMAGE": os.getenv("DEFAULT_APP_IMAGE", "ghcr.io/krvtzz/metacritic-game-tracker:latest"),
              "VPS_APP_DIR": "/home/krvtzz/projects/metacritic-game-tracker",
          }

          values = {key: os.getenv(key) or value for key, value in defaults.items()}
          templates = {
              "docker-compose.yml": ".deploy-rendered/docker-compose.yml",
          }

          pattern = re.compile(r"\$\{([A-Z0-9_]+)(?::-(.*?))?\}")

          def render(content: str) -> str:
              def replace(match: re.Match[str]) -> str:
                  key = match.group(1)
                  fallback = match.group(2)
                  return values.get(key) or fallback or ""
              return pattern.sub(replace, content)

          for source, target in templates.items():
              content = Path(source).read_text()
              rendered = render(content)
              # podman fix: remove volume mount
              rendered = re.sub(r'^\s*-\s*\.:/app\s*$\n?', '', rendered, flags=re.MULTILINE)
              # podman fix: remove build: .
              rendered = re.sub(r'^\s*build:\s*\.\s*$\n?', '', rendered, flags=re.MULTILINE)
              # nginx fix: bind to 127.0.0.1
              rendered = rendered.replace('"- 8001:8000"', '"127.0.0.1:8001:8000"').replace('8001:8000', '127.0.0.1:8001:8000')
              # APP_IMAGE fix: replace CI_REGISTRY_IMAGE with APP_IMAGE
              rendered = rendered.replace('CI_REGISTRY_IMAGE', 'APP_IMAGE')
              Path(target).write_text(rendered)
          PY

      - name: Render .env.deploy
        if: steps.check.outputs.configured == 'true'
        env:
          ENV_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "$ENV_SECRETS" | jq -r 'to_entries | .[] | select(.key | test("^(DATABASE_URL|POSTGRES_|APP_ENV|OPENCODE_)")) | "\(.key)=\(.value)"' > .deploy-rendered/.env.deploy || true

      - name: Copy deploy files to VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".deploy-rendered/docker-compose.yml,.deploy-rendered/.env.deploy,scripts/"
          target: ${{ vars.VPS_APP_DIR || '/home/krvtzz/projects/metacritic-game-tracker' }}
          strip_components: 1

      - name: Pull and restart on VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,GH_TOKEN,GH_ACTOR
          script: |
            APP_DIR="${VPS_APP_DIR:-/home/krvtzz/projects/metacritic-game-tracker}"
            mkdir -p "$APP_DIR/logs"
            
            cd "$APP_DIR" && find . -maxdepth 1 ! -name '.' ! -name '.env' ! -name 'logs' ! -name 'docker-compose.yml' ! -name 'scripts' -exec rm -rf {} +
            
            if [ -f "$APP_DIR/.env.deploy" ]; then
                mv "$APP_DIR/.env.deploy" "$APP_DIR/.env"
                chmod 600 "$APP_DIR/.env"
            fi
            chmod 777 "$APP_DIR/logs"
            
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/podman/podman.sock"
            
            podman system service --time 30 >/dev/null 2>&1 </dev/null &
            PODMAN_PID=$!
            sleep 5
            
            podman login ghcr.io -u "$GH_ACTOR" -p "$GH_TOKEN"
            podman compose pull
            podman compose up -d --force-recreate
            sleep 15
            podman ps -a
            podman image prune -f
            kill $PODMAN_PID 2>/dev/null || true
