name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Lint (Tach)
        run: poetry run tach check

      - name: Test
        run: poetry run pytest tests/ --tb=short -q

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/metacritic-game-tracker" >> "$GITHUB_OUTPUT"

      - name: Set tags
        id: tags
        run: |
          TAGS="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA},${{ steps.image.outputs.name }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  deploy-vps:
    runs-on: ubuntu-latest
    needs: publish
    env:
      APP_IMAGE: ${{ vars.APP_IMAGE || needs.publish.outputs.image }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/krvtzz/projects/metacritic-game-tracker' }}
    steps:
      - name: Check VPS secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets not fully configured — skipping deploy"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Render docker-compose for VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p .deploy-rendered
          IMAGE="${APP_IMAGE}"
          python3 - <<PY
          import os, re
          from pathlib import Path

          image = os.getenv("APP_IMAGE", "ghcr.io/krvtzz/metacritic-game-tracker:latest")
          content = Path("docker-compose.yml").read_text()

          # Подставляем образ из GHCR вместо CI_REGISTRY_IMAGE/переменной
          content = re.sub(
              r'image:\s*\$\{CI_REGISTRY_IMAGE[^}]*\}[^\n]*',
              f'image: {image}',
              content
          )
          # Убираем build: . — на VPS исходников нет, только образ
          content = re.sub(r'^\s*build:\s*\.\s*$\n?', '', content, flags=re.MULTILINE)
          # Убираем .:/app volume mount — на VPS только ./logs нужен
          content = re.sub(r'^\s*-\s*\.:/app\s*$\n?', '', content, flags=re.MULTILINE)
          # nginx: порт 8001 только на 127.0.0.1 (nginx реверс-прокси, не наружу)
          content = content.replace('- "8001:8000"', '- "127.0.0.1:8001:8000"')
          content = content.replace("- '8001:8000'", "- '127.0.0.1:8001:8000'")
          content = content.replace('- 8001:8000', '- 127.0.0.1:8001:8000')
          # БД порт тоже только локально (миграции через SSH, не наружу)
          content = content.replace('- "5440:5432"', '- "127.0.0.1:5440:5432"')
          content = content.replace('- 5440:5432', '- 127.0.0.1:5440:5432')

          Path(".deploy-rendered/docker-compose.yml").write_text(content)
          PY
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}

      - name: Copy deploy files to VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".deploy-rendered/docker-compose.yml,scripts/"
          target: ${{ env.VPS_APP_DIR }}
          strip_components: 1

      - name: Pull and restart on VPS
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          APP_IMAGE: ${{ env.APP_IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,GH_TOKEN,GH_ACTOR,APP_IMAGE
          script: |
            APP_DIR="${VPS_APP_DIR:-/home/krvtzz/projects/metacritic-game-tracker}"
            mkdir -p "$APP_DIR/logs"
            chmod 777 "$APP_DIR/logs"

            # Podman rootless: активируем socket через systemd --user
            # (не нужен ручной `podman system service` — подключаемся через переменную)
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/podman/podman.sock"

            # Авторизация в GHCR: --password-stdin чтобы не светить токен в логах
            echo "$GH_TOKEN" | podman login ghcr.io -u "$GH_ACTOR" --password-stdin

            cd "$APP_DIR"

            # Передаём APP_IMAGE в compose через переменную окружения
            export APP_IMAGE="$APP_IMAGE"

            podman compose -f docker-compose.yml pull
            podman compose -f docker-compose.yml up -d --force-recreate

            sleep 10
            podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            podman image prune -f
