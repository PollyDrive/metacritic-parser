# Podman-совместимый compose (podman compose up -d)
# Логи — stdout/stderr, без Docker Loki plugin

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metacritic_game_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_HOST_PORT:-5440}:5432"
    volumes:
      - metacritic_game_tracker_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-metacritic_game_tracker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Веб-сервер: только читает данные и отдаёт UI. Ингестию не запускает —
  # иначе каждый воркер uvicorn/gunicorn поднял бы свой планировщик.
  app:
    image: ${CI_REGISTRY_IMAGE:-metacritic-game-tracker-app}:latest
    build: .
    restart: always
    depends_on:
      db:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8089}:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-metacritic_game_tracker_db}
      APP_PORT: 8080
      MONITORING_USERNAME: ${MONITORING_USERNAME}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
    volumes:
      - ./logs:/app/logs
      - .:/app
    command: ["python", "main.py"]

  # Планировщик ингестии — отдельный процесс, ровно один экземпляр.
  # Срок следующего прогона считается от последнего успешного прогона в БД,
  # поэтому рестарт контейнера не сбрасывает расписание.
  worker:
    image: ${CI_REGISTRY_IMAGE:-metacritic-game-tracker-app}:latest
    build: .
    restart: always
    depends_on:
      db:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-metacritic_game_tracker_db}
      MONITORING_USERNAME: ${MONITORING_USERNAME}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
    volumes:
      - ./logs:/app/logs
      - .:/app
    command: ["python", "scripts/run_scheduler.py"]

volumes:
  metacritic_game_tracker_db:
