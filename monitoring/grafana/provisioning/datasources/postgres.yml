apiVersion: 1
# cost_usd уже посчитан в БД из справочника цен схемы meta — дашборд НЕ хардкодит цены.
datasources:
  - name: Metacritic Game Tracker Postgres
    type: postgres
    uid: metacritic-game-tracker-postgres
    url: host.containers.internal:5434
    database: ${METACRITIC_GAME_TRACKER_DB_NAME}
    user: ${METACRITIC_GAME_TRACKER_DB_USER}
    secureJsonData:
      password: "${METACRITIC_GAME_TRACKER_DB_PASSWORD}"
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
