":1907,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1910,"publicationSlug":1911,"reviewedProduct":1912,"platform":1774},"Elden Ring is the real next step for souls-like standards. It is unlike anything FromSoftware has created before, displaying an uncanny world that will keep on wowing players even as they pile up more and more hours of gameplay. Elden Ring is, thus, a prime candidate to become the 2022 GOTY.\r\n","https:\u002F\u002Fareajugones.sport.es\u002Fvideojuegos\u002Fanalisis-elden-ring-la-mesa-redonda-tiene-nuevo-rey-arturo\u002F","2022-02-23","","Areajugones","areajugones",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1915,"platform":1916,"gameTaxonomy":1918},"games","\u002Fgame\u002Felden-ring\u002F",{"url":1874,"score":1777},{"id":1917,"name":1774},1500000062,{"game":1919,"platform":1920},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1922,"score":41,"url":1923,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1924,"publicationSlug":1925,"reviewedProduct":1926,"platform":1774},"Elden Ring is a crowning achievement of over a decade of Miyazaki’s and FromSoftware’s work, and an amazing example of how to find a whole new level of fun in a well-known and somewhat worn-out formula. The open world turned out to be a perfect fit for the genre and you can still tell this masterpiece was created by the famous Japanese studio. I honestly haven’t been so excited about a game since the first Dark Souls.","https:\u002F\u002Fcdaction.pl\u002Frecenzje\u002Frecenzja-elden-ring-to-nie-jest-dark-souls-iv-to-cos-znacznie-wiecej","CD-Action","cd-action",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1927,"platform":1928,"gameTaxonomy":1929},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1930,"platform":1931},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1933,"score":41,"url":1934,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1935,"publicationSlug":1936,"reviewedProduct":1937,"platform":1774},"An uncompromising vision of wonder and terror, Elden Ring is the ultimate dark fantasy odyssey.","https:\u002F\u002Fculturedvultures.com\u002Felden-ring-ps5-review\u002F","Cultured Vultures","cultured-vultures",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1938,"platform":1939,"gameTaxonomy":1940},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1941,"platform":1942},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1944,"score":41,"url":1945,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1946,"publicationSlug":1947,"reviewedProduct":1948,"platform":1774},"As an experience, it's one of the most wondrous and open-ended games I've played in years.","https:\u002F\u002Fwww.destructoid.com\u002Freviews\u002Freview-elden-ring\u002F","Destructoid","destructoid",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1949,"platform":1950,"gameTaxonomy":1951},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1952,"platform":1953},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1955,"score":41,"url":1956,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1957,"publicationSlug":1958,"reviewedProduct":1959,"platform":1774},"Elden Ring is a tour de force and is maybe the only example of a studio underselling a title. It's an M-rated Breath of the Wild, full of secrets, intrigue, and an enthralling world to explore. It's a game that makes me excited about gaming, and it's fantastic to see a highly anticipated title like this turn out so well. ","https:\u002F\u002Fwww.gamerevolution.com\u002Freview\u002F702562-elden-ring-review-worth-buying-playing-ps4-ps5-pc-xbox-one-series-x-s","Game Revolution","game-revolution",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1960,"platform":1961,"gameTaxonomy":1962},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1963,"platform":1964},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1966,"score":41,"url":1967,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1968,"publicationSlug":1969,"reviewedProduct":1970,"platform":1774},"Elden Ring is the true triumph that FromSoftware was striving for all those years. Complete and utter triumph.","https:\u002F\u002Fgamemag.ru\u002Freviews\u002Felden-ring-review-ps5","GameMAG","gamemag",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1971,"platform":1972,"gameTaxonomy":1973},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1974,"platform":1975},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1977,"score":41,"url":1978,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1979,"publicationSlug":1980,"reviewedProduct":1981,"platform":1774},"Elden Ring is the culmination of everything Dark Souls brought before it, mixed with a fresh take on the open world genre that leaves no hand held with minimal boring sequences or clogged quest logs. Despite a few growing pains and the real fun beginning a few hours in, Elden Ring is what every game in its genre should strive to be; a challenging, mysterious adventure that never ceases to amaze, only getting better the more time you spend in its dark, yet absolutely beautiful world.","https:\u002F\u002Fwww.gamer.no\u002Fartikler\u002Fslik-ser-et-mesterverk-ut\u002F514614","Gamer.no","gamerno",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1982,"platform":1983,"gameTaxonomy":1984},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1985,"platform":1986},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1988,"score":41,"url":1989,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":1990,"publicationSlug":1991,"reviewedProduct":1992,"platform":1774},"I'm joyfully exploring every inch of the land and delighting in my discoveries, and I don't see myself stopping any time soon.\r\n","https:\u002F\u002Fventurebeat.com\u002F2022\u002F02\u002F23\u002Felden-ring-is-a-brilliant-monument-to-fromsoftwares-legacy\u002F","GamesBeat","gamesbeat",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":1993,"platform":1994,"gameTaxonomy":1995},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":1996,"platform":1997},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":1999,"score":41,"url":2000,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":2001,"publicationSlug":2002,"reviewedProduct":2003,"platform":1774},"Elden Ring is an exceptional, accomplished work that realises a fantasy world of solemnity, beauty, and menacing uncertainty you can’t help but lose yourself in.","https:\u002F\u002Fwww.gameshub.com\u002Fnews\u002Freviews\u002Felden-ring-review-ps5-13634\u002F","GamesHub","gameshub",{"id":1875,"type":1913,"title":1770,"url":1914,"criticScoreSummary":2004,"platform":2005,"gameTaxonomy":2006},{"url":1874,"score":1777},{"id":1917,"name":1774},{"game":2007,"platform":2008},{"id":1875,"name":1770},{"id":1917,"name":1774},{"quote":2010,"score":41,"url":2011,"date":1908,"author":1909,"authorSlug":1440,"image":1440,"publicationName":2012,"publicationSlug":2013,"reviewedProduct":2014,"platform":1774},"Combining the deep and challenging combat FromSoftware is known for with a vast and varied world that's always a pleasure to explore, Elden Ring is quite simply incredible. From the moment you step foot into The Lands Between you'll be engrossed, and while you'll no doubt experience some setbacks on your adventure – such as a boss that at first seems impossible to defeat – there's always somewhere else to go to cool off, pick yourself up, and perhaps power yourself up before returning to have another go. That is to say, you don't just play Elden Ring; you live in its world for hours at a time. It will consume you, but you'll willingly throw yourself into its maw with fervour.","https:\u002F\u002Fwww.g
