eviews\u002Fmetacritic\u002Fcritic\u002Fgames\u002Felden-ring\u002Fstats\u002Fweb?componentName=critic-score-summary&componentDisplayName=Critic+Score+Summary&componentType=MetaScoreSummary",{"componentName":3416,"componentDisplayName":3417,"componentType":3418},"critic-score-summary","Critic Score Summary","MetaScoreSummary",{"data":3420,"links":3587,"meta":3599},{"id":1915,"totalResults":1819,"item":3421},{"default":3422,"positive":3506,"negative":3585,"neutral":3586},[3423,3437,3449,3461,3473,3484,3495],{"quote":3424,"score":41,"url":1961,"date":3425,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3426,"publicationSlug":3427,"reviewedProduct":3428,"platform":1814},"Elden Ring is simply a game that the player naturally adapts to their own style of play. Challenging at times, vicious at others, but mostly incredibly fun. The enjoyable pace makes the hours of play pass by like water, and each path opens up a few more, only to come together again after a fair amount of exploration before the next big reveal. [Issue#318]","2024-01-30","LEVEL (Czech Republic)","level-czech-republic",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3431,"platform":3432,"gameTaxonomy":3434},"games","\u002Fgame\u002Felden-ring\u002F",{"url":1914,"score":1817},{"id":3433,"name":1814},1500000062,{"game":3435,"platform":3436},{"id":1915,"name":1810},{"id":3433,"name":1814},{"quote":3438,"score":41,"url":3439,"date":3440,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3441,"publicationSlug":3442,"reviewedProduct":3443,"platform":1814},"Elden Ring is a superlative title, one of those works capable of becoming an event and becoming engraved in the collective imagination. It achieves this by remaining faithful to its formula and exporting its identity to the concept of the open world, achieving its own personal approach, resulting in a world that is visually stunning, and that works with overwhelming precision in terms of mechanics. An excellent videogame that also maintains the concreteness of its proposal.","https:\u002F\u002Fes.ign.com\u002Felden-ring\u002F179924\u002Freview\u002Fanalisis-de-elden-ring-la-formula-souls-y-el-mundo-abierto-se-dan-la-mano-para-alcanzar-la-excelenci ","2022-02-28","IGN Spain","ign-spain",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3444,"platform":3445,"gameTaxonomy":3446},{"url":1914,"score":1817},{"id":3433,"name":1814},{"game":3447,"platform":3448},{"id":1915,"name":1810},{"id":3433,"name":1814},{"quote":3450,"score":41,"url":3451,"date":3452,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3453,"publicationSlug":3454,"reviewedProduct":3455,"platform":1814},"Elden Ring packs its intricately crafted world - a world which should be used as a reference point for open-world design moving forward - with more impressive boss fights and secrets than you can shake a giant greatsword at. Although its punishing combat system may not be to everyone’s taste, it is an essential experience both for FromSoftware newcomers and seasoned veterans alike.","https:\u002F\u002Fwww.theloadout.com\u002Felden-ring\u002Freview-ps5","2022-03-02","The Loadout","the-loadout",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3456,"platform":3457,"gameTaxonomy":3458},{"url":1914,"score":1817},{"id":3433,"name":1814},{"game":3459,"platform":3460},{"id":1915,"name":1810},{"id":3433,"name":1814},{"quote":3462,"score":41,"url":3463,"date":3464,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3465,"publicationSlug":3466,"reviewedProduct":3467,"platform":1814},"Elden Ring is a crowning achievement of over a decade of Miyazaki’s and FromSoftware’s work, and an amazing example of how to find a whole new level of fun in a well-known and somewhat worn-out formula. The open world turned out to be a perfect fit for the genre and you can still tell this masterpiece was created by the famous Japanese studio. I honestly haven’t been so excited about a game since the first Dark Souls.","https:\u002F\u002Fcdaction.pl\u002Frecenzje\u002Frecenzja-elden-ring-to-nie-jest-dark-souls-iv-to-cos-znacznie-wiecej","2022-02-23","CD-Action","cd-action",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3468,"platform":3469,"gameTaxonomy":3470},{"url":1914,"score":1817},{"id":3433,"name":1814},{"game":3471,"platform":3472},{"id":1915,"name":1810},{"id":3433,"name":1814},{"quote":3474,"score":2824,"url":3475,"date":3464,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3476,"publicationSlug":3477,"reviewedProduct":3478,"platform":1814},"Elden Ring feels like the natural evolution of a video game series that continues to reinvent itself after more than 13 years of its birth. FromSoftware is simply the best at what they do. While there are some technical issues and repetitive structures and creatures, Elden Ring is a cruelly wonderful piece of work and one of the best adventure games of recent years.","https:\u002F\u002Fmalditosnerds.com\u002Felden-ring\u002Fanalisis-elden-ring-el-soulslike-llega-al-mundo-abierto-n19795","Malditos Nerds","malditos-nerds",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3479,"platform":3480,"gameTaxonomy":3481},{"url":1914,"score":1817},{"id":3433,"name":1814},{"game":3482,"platform":3483},{"id":1915,"name":1810},{"id":3433,"name":1814},{"quote":3485,"score":25,"url":3486,"date":3464,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3487,"publicationSlug":3488,"reviewedProduct":3489,"platform":1814},"The years of waiting were worth it, Elden Ring is brilliant. It offers a huge amount of content, a beautiful world and addictive gameplay. But the series does start to feel a little bit stale.","https:\u002F\u002Fgames.tiscali.cz\u002Frecenze\u002Felden-ring-recenze-nejambicioznejsi-souls-hry-529377","Games.cz","gamescz",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3490,"platform":3491,"gameTaxonomy":3492},{"url":191 blicationName":3530,"publicationSlug":3531,"reviewedProduct":3532,"platform":1814},"Elden Ring is a stunning achievement from a literal video game architecture perspective, along with creating a difficult but not wildly punishing game that everyone, even non-Soulsborne devotees, should be able to enjoy. I have not been this impressed with an open world since Skyrim, and Elden Ring even surpasses that in many ways. It’s an easy game to recommend to anyone and everyone, and deserves the explosive sales success we’ve seen, dwarfing old FromSoft records. Elden Ring is a gaming achievement the likes of which we rarely seen, and you will be remiss to not pick it up and see what the hype is about for yourself. ","https:\u002F\u002Fwww.forbes.com\u002Fsites\u002Fpaultassi\u002F2022\u002F05\u002F12\u002Felden-ring-review-ps5-game-of-the-generation-so-far\u002F","2022-05-13","Forbes","forbes",{"id":1915,"type":3429,"title":1810,"url":3430,"criticScoreSummary":3533,"platform":3534,"gameTaxonomy":3535},{"url":1914,"score":1817},{"id":3433,"name":1814},{"game":3536,"platform":3537},{"id":1915,"name":1810},{"id":3433,"name":1814},{"quote":3539,"score":41,"url":3540,"date":3541,"author":1961,"authorSlug":1440,"image":1440,"publicationName":3542,"publicationSlug":3543,"reviewedProduct":3544,"platform":1814},"More than anything, we must always stress that, yes, the Lands Between — the open world, therefore — is the main highlight. In an era taken by mediocre open-world games, it's refreshing to see that a company new to this concept got it so precisely right. There's no doubt about it: this is, indeed, one of the best games of recent years. If you're a fan of Open Worlds, no matter what level of challenge you're used to, give it a go. The chances of regret are almost zero. We often think of FromSoftware games in extreme ways. I love it. I hate it. It's amazing. It's unbearable. Elden Ring does bump into these dualities, but tends to be much more attractive to the public in general." in an unbelievable adventure of epic proportions simply dripping with artistic genius and effort.","CurryMcFlurri",1787940843292,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3757,"gameTaxonomy":3758},{"id":1912,"name":1814},{"family":3759,"title":3760,"game":3761,"platform":3762},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3764,"quote":3765,"score":1434,"thumbsUp":1440,"thumbsDown":1440,"date":3766,"author":3767,"version":3768,"spoiler":1148,"reviewedProduct":3769,"platform":1814},"de4bed51-9688-4458-b89d-618c7485ac60","Elden Ring is hands down the peak of open-world RPGs. It doesn't clutter your map with icons or hold your hand — it trusts you to explore. The sense of discovery is unmatched. Every cave, mountain, and hidden path conceals a massive secret, making it impossible to stop until you’ve cleared every single inch of the map. With endless build options, incredible boss fights, and a breathtaking atmosphere, it offers absolute freedom and peak satisfaction. A flawless 10\u002F10 masterpiece. Must play!","2026-08-27","aganbayev",1787902468119,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3770,"gameTaxonomy":3771},{"id":1912,"name":1814},{"family":3772,"title":3773,"game":3774,"platform":3775},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3777,"quote":3778,"score":1434,"thumbsUp":1440,"thumbsDown":1440,"date":3779,"author":3780,"version":3781,"spoiler":1148,"reviewedProduct":3782,"platform":1814},"ed4e5b95-ed52-4c2c-8923-9a840ca9e5af","Simply one of the best game ever created, once you understand that is a souls game and you need to learn pattern etc you really enjoyed it. The open world is massive and beautiful with a lot of secret","2026-08-19","Toshikage",1787160453558,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3783,"gameTaxonomy":3784},{"id":1912,"name":1814},{"family":3785,"title":3786,"game":3787,"platf time and it often kills you again causing you to lose your hard earned runes permanently. The controls are sluggish and the camera often is not dynamic enough to help you see your way out of trouble. The final nail in the coffin is the story, or lack thereof. There is not enough of it to grasp on to and make me understand why Im doing what Im doing, wandering around the vast, beautiful open world, or even really care. Your character is bland,the circumstances vague, and you wander aimlessly.\n\nThere are those this game was meant for. I was not one of them.","2025-06-08","matthall3791",1749364681252,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3813,"gameTaxonomy":3814},{"id":1912,"name":1814},{"family":3815,"title":3816,"game":3817,"platform":3818},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3820,"quote":3821,"score":247,"thumbsUp":1440,"thumbsDown":1440,"date":3822,"author":3823,"version":3824,"spoiler":1148,"reviewedProduct":3825,"platform":1814},"e1ca4bea-ad2c-45e9-9895-a59c16048b0c","They should've gotten the actual FromSoftware to make this game. Cause no way did the people who made the bosses in DS3 and Bloodborne make the pieces of **** in this one.","2025-06-06","Zeeboomer02",1749171498345,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3826,"gameTaxonomy":3827},{"id":1912,"name":1814},{"family":3828,"title":3829,"game":3830,"platform":3831},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3833,"quote":3834,"score":247,"thumbsUp":1440,"thumbsDown":1440,"date":3835,"author":3836,"version":3837,"spoiler":1148,"reviewedProduct":3838,"platform":1814},"6a6f8e3a-4130-4577-ba5a-9af94b08e10d","It's great and it ****. Inconsistent difficulty is the biggest problem. Some areas are a blast - a challenge and lots of fun. Other areas are literally impossible to pass because of the extreme difficulty. It has a lot of content, but you'll be highly frustrated trying to experience much of it.","2025-05-14","multiwalrus",1747244350232,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3839,"gameTaxonomy":3840},{"id":1912,"name":1814},{"family":3841,"title":3842,"game":3843,"platform":3844},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3846,"quote":3847,"score":247,"thumbsUp":1440,"thumbsDown":1440,"date":3848,"author":3849,"version":3850,"spoiler":1148,"reviewedProduct":3851,"platform":1814},"96f0c91d-4102-4d39-bb1f-e0e86c7c049b","Overrated game that did so much wrong what made Dark Souls so good. Hyper aggressive bosses with endless combos and huge areas with nothing useful in it make no fun. PvP is boring in this game and no fun at all","2025-04-12","DannyDurak",1744446858298,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3852,"gameTaxonomy":3853},{"id":1912,"name":1814},{"family":3854,"title":3855,"game":3856,"platform":3857},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3859,"quote":3860,"score":247,"thumbsUp":1440,"thumbsDown":1440,"date":3861,"author":3862,"version":3863,"spoiler":1148,"reviewedProduct":3864,"platform":1814},"23b23d49-2ccb-4eb0-ad80-016ec414d875","After 156 hours I must conclude that the souls fomular doesnt work on an open world. They is so much quantity in this game without quality. Bosses like Margit, Radahn or Mogh are peak bosses but they an absolute minority. All dragon bosses are bad in Elden Ring. They are sadly all bad designed and balanced. They have cool over the top attacks but gameplay wise all the same. 90% of the bosses are reused and boring. The dodge and hit mechanic are its limit got sadly boring in the end.\nThere is no variety every weapon plays almost the same and armor is useless. Its my opinion but the passive playstyle where you always is sometimes  even frustrating and boring. The dodge timing is now so thight that its almost impossible to create fair **** the parry mechanic in Sekiro is waymore satisfying. Imagine playing against Consort Radahn or Fortissax but with parrys and mikiri counters etc. This would be mind blowing. It becomes a battle between two power houses and not just a battle where you try to avoid the battle. Another big malus is the loot. In the first area. Its fun gathering loot. But midgame the loot is 99% useless because of your build and a waste if time. So you stop looting. But the openworld has only battles, loot or mini quest (conversations). Therefore you stop exploring and start to rush the game. \nIn the end its clear that most of the good reviews are written by Soulsfanatics. At least the dlc was able to fix the mistakes of the maingame !","2025-03-21","Bigspin",1742564799884,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3865,"gameTaxonomy":3866},{"id":1912,"name":1814},{"family":3867,"title":3868,"game":3869,"platform":3870},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},[3872,3880,3888,3901,3914,3927,3940],{"id":3663,"quote":3664,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3665,"author":3666,"version":3667,"spoiler":1148,"reviewedProduct":3873,"platform":1814},{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3874,"gameTaxonomy":3875},{"id":1912,"name":1814},{"family":3876,"title":3877,"game":3878,"platform":3879},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3676,"quote":3677,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3678,"author":3679,"version":3680,"spoiler":1148,"reviewedProduct":3881,"platform":1814},{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3882,"gameTaxonomy":3883},{"id":1912,"name":1814},{"family":3884,"title":3885,"game":3886,"platform":3887},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3889,"quote":3890,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3891,"author":3892,"version":3893,"spoiler":1148,"reviewedProduct":3894,"platform":1814},"f9b382b0-7980-4fa6-9ac6-0c2a03376ffc","Insane art direction, incredible sound design and phenomenal atmosphere. \n\nHowever, I hate how bosses and most enemies have crazy combos that never end and never give you a second to hit back. Also, I don't think a simple encounter in the wilds should feel as difficult as an endgame boss from earlier Souls games.\n\nI don't like the open-world structure. Most of your time is spent riding your horse and wasting time trying to find something to do that doesn't involve just killing everything you see.\n\nQuests are impossible to follow or complete without using the wiki. If you don't, you will either completely miss the next objective or randomly stumble on the NPC like 50 hours later and now they're dead.\n\nAnother thing. In previous Souls games, items and gear were found naturally through exploring all nooks and crannies. There doesn't seem to be as much stuff in the environment to find this time around, I'm never rewarded for going out of my way to explore, unless you count rewards from completing dungeons... which, most of the time, end up useless to you because of stats requirements. This creates a frustrating gameplay loop where you work your butt off to clear a difficult boss only to get a reward you won't even use. This happens over and over again unless you use a wiki to plan out your build and route but that defeats the whole point of exploration.\n\nFinally, I think the game takes too long to beat. I prefer the previous Souls games that are more focused and intentional. Elden Ring feels bloated.","2026-05-28","MisteurFox",1779961697807,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3895,"gameTaxonomy":3896},{"id":1912,"name":1814},{"family":3897,"title":3898,"game":3899,"platform":3900},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3902,"quote":3903,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3904,"author":3905,"version":3906,"spoiler":1148,"reviewedProduct":3907,"platform":1814},"288159a7-6d6c-468a-b035-18e1fb29a73a","I have a love hate relationship with Elden Ring. It has some of the coolest weapons\u002Fbuilds in all Fromsoft history and NG+7 is actually doable and fun to play through, but that's where the positives end. Open world games are overwhelming nowadays for someone who likes to complete games. Waaaay too many copy pasted dungeons with copy pasted bosses. There's too many crannies to search and vast open areas with nothing of note. When you do find an item hidden out in the open world, 9 times out of 10 it's a leaf or a mushroom. You are not rewarded nearly enough for going down optional paths and that's a problem for a game as big as Elden Ring. The bosses are more aggressive than ever before and there needs to be a line. Bosses have these seemingly endless combos with lots of forward momentum. You'll get a VERY small window of opportunity to hit the boss like once or twice, then it's back to these ridiculously long combos. You barely get to attack, it's just roll city and if you get caught, a third or more of your HP is gone. And my last complaint is that this game is waaaaay too long for a souls game. Part of the fun of these games is that the run time is long enough to be significant but short enough to where you want to go through it again with a new weapon\u002Fbuild. In Elden Ring I was exhausted by the time the credits rolled and I didn't want to try out any cool new builds. Such a shame. ","2026-05-18","Ansemriku10",1779730066336,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3908,"gameTaxonomy":3909},{"id":1912,"name":1814},{"family":3910,"title":3911,"game":3912,"platform":3913},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3915,"quote":3916,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3917,"author":3918,"version":3919,"spoiler":1148,"reviewedProduct":3920,"platform":1814},"0109fe51-b6d5-4086-88c1-1385a97f487b","Excellent mais le je ne nous donne pas envie d'explorer a cause de sa difficulté ","2026-02-07","gami667",1774118419460,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3921,"gameTaxonomy":3922},{"id":1912,"name":1814},{"family":3923,"title":3924,"game":3925,"platform":3926},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3928,"quote":3929,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3930,"author":3931,"version":3932,"spoiler":1148,"reviewedProduct":3933,"platform":1814},"56d7638b-3cbe-44e5-8b8e-7f0e215f4008","It’s good but doesn’t really deserve the high scores people are giving it. There’s a lot of copy and paste in the game. Both from a level point of view and bosses. Making the same boss a different colour isn’t a new boss. You fight the same ones over and over again. It’s just lazy","2026-03-04","Shadow757",1772591874781,{"id":1915,"type":3429,"title":1810,"url":3430,"platform":3934,"gameTaxonomy":3935},{"id":1912,"name":1814},{"family":3936,"title":3937,"game":3938,"platform":3939},{"id":1922,"name":1810},{"id":1807,"name":1810},{"id":1915,"name":1810},{"id":1912,"name":1814},{"id":3941,"quote":3942,"score":547,"thumbsUp":1440,"thumbsDown":1440,"date":3215,"author":3943,"version":3944,"spoiler":1148,"reviewedProduct":3945,"platform":1814},"f99b653c-9caa-46af-8dcb-c9a10f4b3993","Personally, I don't think the open world works - it feels unnecessary and adds a lot of padding to the game. Also, the discount chalice dungeons aren't my favourite side activity, and I don't think offers enough to be worth exploring. Furthermore, I'm not a fan of recycling bosses or just duplicating bosses to make the fight harder (lazy game design). With that being said, it's not my least favourite Soulsborne game. It's still pretty good, just not great.","Blitzbjorn",1770800208013,{"id":1915,"type":34
