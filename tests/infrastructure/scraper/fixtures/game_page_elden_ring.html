"mediaType":1440},"a3476890-d054-48e8-aa5a-0504bf4b1263","gamepreview-augsept2026-wolverine.jpg",{"date":2016,"timezone":1958},"2026-07-31 19:05:41.000000","\"Marvel's Wolverine\" (Sony Interactive\u002FInsomniac Games\u002FMarvel)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F07\u002F31\u002Fa3476890-d054-48e8-aa5a-0504bf4b1263\u002Fgamepreview-augsept2026-wolverine.jpg","\u003Cp>Below, we have selected over 20 of the most-anticipated game releases expected over the next two months as we head into the suddenly very busy pre-GTA period. Games are listed in order by release date. \u003C\u002Fp>",{"id":2021,"type":2001,"title":2022,"slug":2023,"date":2024,"url":1440,"isVideo":1440,"description":2025,"tags":2026,"author":2028,"image":2029},"7ccbbcfe-aa63-4994-8e5b-541b1405fa93","The Best Video Games of 2026 So Far","best-video-games-of-2026-at-midyear","2026-07-02 18:33:00","We reveal the 20 best-reviewed video games (for all platforms) released in the first half of 2026, ranked by Metascore.",[2027],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2030,"filename":2031,"dateCreated":2032,"alt":1440,"credits":2034,"path":2035,"cropGravity":1440,"crop":1440,"caption":2036,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"19a7f54c-7874-438b-8266-e982bf08f57c","best-2026-games-midyear.jpg",{"date":2033,"timezone":1958},"2026-07-02 18:33:57.000000","\"Forza Horizon 6\" (Xbox Game Studios)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F07\u002F02\u002F19a7f54c-7874-438b-8266-e982bf08f57c\u002Fbest-2026-games-midyear.jpg","\u003Cp>Which video games impressed critics during the first half of the year? On this page we rank the highest-scoring games with release dates between January 1, 2026 and June 30, 2026. Titles are included based on their Metascores as of July 1, 2026 and must have a&nbsp;\u003Cstrong>minimum of 7 reviews\u003C\u002Fstrong>&nbsp;from professional critics to be eligible for inclusion.\u003C\u002Fp>\u003Cp>Note that ...\u003C\u002Fp>\u003Cp>\u003Cstrong>If a game was released on multiple platforms, we included only the version receiving the largest total number of reviews\u003C\u002Fstrong>&nbsp;(usually, but not always, the PS5 version).\u003C\u002Fp>\u003Cp>New ports of games released in prior years on other platforms are excluded. Expansions\u002FDLC, mobile games, compilations, and \"Definitive\"\u002FGOTY editions are also ineligible.\u003C\u002Fp>",{"id":2038,"type":2001,"title":2039,"slug":2040,"date":2041,"url":1440,"isVideo":1440,"description":2042,"tags":2043,"author":2045,"image":2046},"9cae8737-3d68-42ed-b66e-d5aec287545d","Star Fox Video Games, Ranked","star-fox-video-games-ranked-worst-to-best","2026-06-24 15:42:00","We use Metascores to rank every game in Nintendo's Star Fox series—including the new Switch 2 reboot—from worst to best.",[2044],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2047,"filename":2048,"dateCreated":2049,"alt":1440,"credits":2051,"path":2052,"cropGravity":1440,"crop":1440,"caption":2053,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"ced7d4e7-507d-482a-8f33-1e23707e6379","mainstarfoxgames.jpg",{"date":2050,"timezone":1958},"2026-06-23 23:53:41.000000","\"Star Fox (2026)\" (Nintendo)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F06\u002F23\u002Fced7d4e7-507d-482a-8f33-1e23707e6379\u002Fmainstarfoxgames.jpg","\u003Cp>\u003Cem>Star Fox\u003C\u002Fem>&nbsp;is a bit of an oddity as a brand. The most popular titles in the series are on-rails flight sims, a very hand-holdy genre of game that barely exists anymore. And, aside from&nbsp;\u003Cem>Star Fox\u003C\u002Fem>, it's not a genre that's remembered fondly by many people. But that's the power of Nintendo: What other game publisher would remake a 30-year-old rail shooter in 2026?\u003C\u002Fp>\u003Cp>With the imminent arrival of&nbsp;\u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fstar-fox\u002F\">Star Fox\u003C\u002Fa>\u003Cem>,\u003C\u002Fem>&nbsp;Nintendo's Switch 2 remake of&nbsp;\u003Cem>Star Fox 64\u003C\u002Fem>, we felt like now would be the perfect time to look back on how the past games in the series have performed with game reviewers here on Metacritic. While the SNES original and its sequel on Nintendo 64 were beloved, not all of Nintendo's other attempts to keep the series going in more modern times have gone well. It's really hard to make a blockbuster in a genre that has become as niche as the rail shooter genre has.\u003C\u002Fp>\u003Cp>We don't have scores for every&nbsp;\u003Cem>Star Fox\u003C\u002Fem>&nbsp;game, though. Metacritic doesn't have reviews for SNES games, since that console went out of fashion before Metacritic was founded, so we can't include the original game here–which is a bummer, because its 88 on GameRankings would likely have it competing for the top spot. Likewise, we don't have reviews for&nbsp;\u003Cem>Star Fox 2\u003C\u002Fem>, which was developed decades ago for the SNES but was only ever released as a pre-installed title on the SNES Classic device in 2017.\u003C\u002Fp>\u003Cp>With that said, it's time to do a barrel roll and dive straight in.\u003C\u002Fp>",{"id":2055,"type":2001,"title":2056,"slug":2057,"date":2058,"url":1440,"isVideo":1440,"description":2059,"tags":2060,"author":2062,"image":2063},"5d49f6d3-39ae-478b-aa16-46cf63bed884","James Bond Video Games, Ranked","james-bond-007-video-games-ranked-worst-to-best","2026-05-26 16:01:00","We use Metascores to rank every 007-related videogame from the past three decades.",[2061],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2064,"filename":2065,"dateCreated":2066,"alt":1440,"credits":2068,"path":2069,"cropGravity":1440,"crop":1440,"caption":2070,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"1fdd3059-c2bd-43e3-b741-1db7a05fd6b3","mainjamesbondvideogames.jpg",{"date":2067,"timezone":1958},"2026-05-23 22:18:04.000000","\"007 First Light\" (IO Interactive)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F05\u002F23\u002F1fdd3059-c2bd-43e3-b741-1db7a05fd6b3\u002Fmainjamesbondvideogames.jpg","\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002F007-first-light\u002F\">007: First Light\u003C\u002Fa>, from IO Interactive, launches on May 27 as the first new proper James Bond video game in 14 years. Certainly, we were due for a break after&nbsp;\u003Cem>GoldenEye\u003C\u002Fem>&nbsp;triggered a bit of a gold rush on Bond games, with nine console titles coming out between 1997 and 2005, and with Activision pumping out a few more before the franchise went on hiatus in 2012.\u003C\u002Fp>\u003Cp>But even with that long gap between games,&nbsp;\u003Cem>First Light\u003C\u002Fem>&nbsp;has a high bar to clear—\u003Cem>GoldenEye&nbsp;\u003C\u002Fem>set quite a standard back in the day. As we leap into this new era of James Bond video games, let's take a look at how well past games performed with critics, ranked according to their Metascores—and where&nbsp;\u003Cem>First Light\u003C\u002Fem>&nbsp;fits in.\u003C\u002Fp>\u003Cp>We've got some caveats: While the gaming side of the James Bond franchise dates all the way back to 1982, Metacritic doesn't have reviews for the pre-\u003Cem>GoldenEye\u003C\u002Fem>&nbsp;games. So we aren't including old Atari and Commodore 64 adaptations like&nbsp;\u003Cem>License to Kill\u003C\u002Fem>&nbsp;or&nbsp;\u003Cem>The Spy Who Loved Me\u003C\u002Fem>. And in the cases of multiplatform games, we'll use the platform with the most reviews—though in some cases the other platforms are worth discussing, too, as you'll see down below.\u003C\u002Fp>\u003Cp>Let's dive in!\u003C\u002Fp>",{"id":2072,"type":2001,"title":2073,"slug":2074,"date":2075,"url":1440,"isVideo":1440,"description":2076,"tags":2077,"author":2079,"image":2080},"9b056ecd-eab9-4db9-b2d3-327e468ff0d8","The 20 Best Star Wars Videogames","best-star-wars-videogames-of-all-time","2026-05-04 11:00:00","We use Metascores to rank the all-time best-reviewed games set in the Star Wars universe.",[2078],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2081,"filename":2082,"dateCreated":2083,"alt":1440,"credits":2085,"path":2086,"cropGravity":1440,"crop":1440,"caption":2087,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"036a9e3e-745f-4ddc-96b8-72445e8cc7e1","mainstarwarsvideogames.jpg",{"date":2084,"timezone":1958},"2026-05-01 18:47:38.000000","\"Star Wars: Knights of the Old Republic\" (LucasArts\u002FBioWare)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F05\u002F01\u002F036a9e3e-745f-4ddc-96b8-72445e8cc7e1\u002Fmainstarwarsvideogames.jpg","\u003Cp>Another  Star Wars Day gives us another excuse to think about some of  our favorite  things: Star Wars video games! Game developers have been  creating games based  on \u003Cem>Star Wars\u003C\u002Fem> for most of the five decades  the franchise has existed.  While most haven't exactly been worth  texting mom about, the series has also  managed to produce more than its  fair share of classic video games. \u003C\u002Fp>\u003Cp>For May the 4th, we're going to examine that legacy a little bit by looking at  the 20 highest-scoring \u003Cem>Star Wars\u003C\u002Fem> games in the Metacritic database.  Though with \u003Cem>Star Wars\u003C\u002Fem> being such an old franchise, there is a major  caveat here we should point out: We don't actually have every \u003Cem>Star Wars\u003C\u002Fem> game in  our database, since many of these games pre-date Metacritic itself. \u003C\u002Fp>\u003Cp>So  don't expect anything from the 1980s (and we have just a few  titles from the  '90s). While many of those early games are forgettable,  some of the big missing titles that might have made the list if we had   the reviews are \u003Cem>Dark Forces\u003C\u002Fem>, any of the \u003Cem>X-Wing\u002FTIE Fighter\u003C\u002Fem> games\u003Cem>,\u003C\u002Fem> and \u003Cem>Episode 1 - Racer\u003C\u002Fem>. Also excluded from our list are mobile games or  compilations. \u003C\u002Fp>",{"id":2089,"type":2001,"title":2090,"slug":2091,"date":2092,"url":1440,"isVideo":1440,"description":2093,"tags":2094,"author":2096,"image":2097},"522e45eb-b814-4000-80fd-11a273d6ebcb","Metacritic's 16th Annual Game Publisher Rankings","2026-game-publisher-rankings","2026-03-25 10:45:00","We reveal the past year's best and worst video game publishers (based on their 2025 releases) in the 16th edition of our annual Game Publisher Rankings.",[2095],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2098,"filename":2099,"dateCreated":2100,"alt":1440,"credits":1440,"path":2102,"cropGravity":1440,"crop":1440,"caption":2103,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"af4c82cd-4a12-4a7e-aef3-e4b48269cfe0","maingamepublishers2026.jpg",{"date":2101,"timezone":1958},"2026-03-24 22:40:55.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F03\u002F24\u002Faf4c82cd-4a12-4a7e-aef3-e4b48269cfe0\u002Fmaingamepublishers2026.jpg","\u003Cp>Which game publishers released the best games in 2025?  For the 16th consecutive year, we  sifted through 12 months of  data to determine the best and worst game publishers of the year, based solely on the quality of their 2025 releases. Sales and user reviews do not factor into these rankings; only critic reviews (as captured by each game's Metascore) are used to evaluate performance. \u003C\u002Fp>\u003Cp>Publishers are ranked from worst to best in the gallery below based on a points system, calculated (as in previous years) according to the following four factors:\u003C\u002Fp>\u003Cp>(1) Average Metascore for all  games released in 2025\u003Cbr>       \u003Cem>150 possible points (awarded at 1.5 x the average Metascore)\u003C\u002Fem>\u003C\u002Fp>\u003Cp>(2) % of scored products with good reviews (Metascore of at least \u003Cspan class=\"fmsgreen\" data-shortcode=\"textscore\" data-score=\"75\" data-classnames=\"o-inlineScore-green\">75\u003C\u002Fspan>)\u003Cbr>       \u003Cem>100 possible points (ex: 80% good = 80 points)\u003C\u002Fem>\u003C\u002Fp>\u003Cp>(3) % of scored products with bad reviews (\u003Cspan class=\"fmsred\" data-shortcode=\"textscore\" data-score=\"49\" data-classnames=\"o-inlineScore-red\">49\u003C\u002Fspan> or lower; in this case, a lower % is better)\u003Cbr>       \u003Cem>100 possible points (ex: 20% bad = 80 points)\u003C\u002Fem>\u003C\u002Fp>\u003Cp>(4) Number of \"great\" titles (Metascore of  \u003Cspan class=\"fmsgreen\" data-shortcode=\"textscore\" data-score=\"90\" data-classnames=\"o-inlineScore-green\">90\u003C\u002Fspan> or higher, min. 7 reviews)\u003Cbr>       \u003Cem>Awarded as 5 bonus points for each distinct title with a 90+ score\u003C\u002Fem>\u003C\u002Fp>\u003Cp>As you can see above,  the  Metascore average (the first factor) counts slightly more than the other factors. \u003Cstrong>Only publishers with five or more distinct titles released last year are included in our rankings. \u003C\u002Fstrong>For fans of fine print, additional notes on our methodology appear at the bottom of this page.\u003C\u002Fp>",{"id":2105,"type":2001,"title":2106,"slug":2107,"date":2108,"url":1440,"isVideo":1440,"description":2109,"tags":2110,"author":2112,"image":2113},"55228829-8f61-4267-9fd0-448b5585cb59","Spring Game Preview","spring-2026-game-preview-forza-horizon-6-saros-yoshi-pragmata","2026-03-20 18:57:00","Get details on the most notable video game releases expected between now and May 2026, including Forza Horizon 6, Saros, and more.",[2111],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2114,"filename":2115,"dateCreated":2116,"alt":1440,"credits":2034,"path":2118,"cropGravity":1440,"crop":1440,"caption":2119,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"a1d969c9-382b-46ec-8670-62817f35e10a","gamepreview-spring2026-forzahorizon6.jpg",{"date":2117,"timezone":1958},"2026-03-20 18:38:37.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2026\u002F03\u002F20\u002Fa1d969c9-382b-46ec-8670-62817f35e10a\u002Fgamepreview-spring2026-forzahorizon6.jpg","\u003Cp>Below, we have selected  nearly 20 of the most-anticipated game releases  expected over the next few months. It's a blend of the biggest titles  and the most intriguing indies, including the latest \u003Cem>Forza Horizon\u003C\u002Fem> racer, a new game from the team behind \u003Cem>Returnal\u003C\u002Fem>,  a \u003Cem>Life Is Strange\u003C\u002Fem> sequel, the first new \u003Cem>Yoshi\u003C\u002Fem> game in seven years, and more. Games are listed in order by release date. \u003C\u002Fp>",{"id":2121,"type":2001,"title":2122,"slug":2123,"date":2124,"url":1440,"isVideo":1440,"description":2125,"tags":2126,"author":2128,"image":2129},"8799df02-73d3-4a7b-954c-d07bae95bc4f","Winter Game Preview (2026)","winter-2026-game-preview-resident-evil-requiem-code-vein-2-nioh-3","2026-01-14 15:00:00","Get details on the most notable video game releases expected in January, February, and March, including Resident Evil Requiem.",[2127],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2130,"filename":2131,"dateCreated":2132,"al name":1952},{"id":2198,"filename":2199,"dateCreated":2200,"alt":1440,"credits":2202,"path":2203,"cropGravity":1440,"crop":1440,"caption":2204,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"12598c4b-4c76-4e33-9b19-5b1f463bb6db","games-xbox-2025.jpg",{"date":2201,"timezone":1958},"2025-12-28 23:43:48.000000","\"Split Fiction\" (Electronic Arts\u002FHazelight Studios)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F12\u002F28\u002F12598c4b-4c76-4e33-9b19-5b1f463bb6db\u002Fgames-xbox-2025.jpg","\u003Cp>Which Xbox games  impressed professional reviewers the most during  the past year? This page  contains Metacritic's official list of the 20  best-reviewed titles released for Xbox Series X\u002FS  or Xbox One between  January 1, 2025 and December 31, 2025 ranked by Metascore. Games \u003Cstrong>must have at least 7 scored reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion. \u003C\u002Fp>\u003Cp>If a game appears on both Xbox platforms, only the version  receiving the higher quantity of critic reviews (typically the Xbox  Series X\u002FS version) was eligible. \u003C\u002Fp>",{"id":2206,"type":2001,"title":2207,"slug":2208,"date":2209,"url":1440,"isVideo":1440,"description":2210,"tags":2211,"author":2213,"image":2214},"92771279-1805-4656-8166-78c56b113d7a","The Worst Video Games of 2025","worst-videogames-of-2025","2025-12-12 16:55:00","Here are Metacritic's 10 lowest-scoring video games released in 2025.",[2212],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2215,"filename":2216,"dateCreated":2217,"alt":1440,"credits":2219,"path":2220,"cropGravity":1440,"crop":1440,"caption":2221,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"14eabc3b-d351-4af8-859d-a4714647c710","games-worst-2025-mindseye.jpg",{"date":2218,"timezone":1958},"2025-12-12 00:23:41.000000","\"MindsEye\" (IO Interactive Partners)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F12\u002F12\u002F14eabc3b-d351-4af8-859d-a4714647c710\u002Fgames-worst-2025-mindseye.jpg","\u003Cp>On this page we rank the  lowest-scoring games released for any  platform between January 1, 2025 and December 31, 2025 in North America.  \u003C\u002Fp>\u003Cp>Because we require 4  reviews from professional critics to calculate  a Metascore, any titles with fewer than 4 reviews  are excluded. (For  our \u003Cstrong>best\u003C\u002Fstrong> lists, we have a higher cutoff, but we think  relaxing the requirements here makes for a more fun worst list. We also  opened the list up to mobile and VR releases, DLC, and compilations.)  And if a single title would have landed on the list multiple times due  to low scores on more than one platform, we only included the  lowest-scoring version.\u003C\u002Fp>",{"id":2223,"type":2001,"title":2224,"slug":2225,"date":2226,"url":1440,"isVideo":1440,"description":2227,"tags":2228,"author":2230,"image":2231},"54aea254-3336-4300-9b43-643d1cd07b3b","Every Metroid Game, Ranked","every-metroid-game-ranked-worst-to-best","2025-12-03 00:22:00","We rank every game in Nintendo's Metroid franchise—including the new Metroid Prime 4: Beyond—from worst to best by Metascore.",[2229],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2232,"filename":2233,"dateCreated":2234,"alt":1440,"credits":2236,"path":2237,"cropGravity":1440,"crop":1440,"caption":2238,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"3d7c6f1f-52e5-469a-84fb-a8a7c13f06a9","mainmetroidranked.jpg",{"date":2235,"timezone":1958},"2025-12-03 00:25:42.000000","\"Metroid Prime Remastered\" (Nintendo)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F12\u002F03\u002F3d7c6f1f-52e5-469a-84fb-a8a7c13f06a9\u002Fmainmetroidranked.jpg","\u003Cp>Despite being a beloved Nintendo franchise, new \u003Cem>Metroid\u003C\u002Fem> games have been few and far between lately. The last new \u003Cem>Metroid\u003C\u002Fem> title  was the side-scroller \u003Cem>Metroid Dread\u003C\u002Fem> in 2021, the last new 3D \u003Cem>Metroid\u003C\u002Fem> game was \u003Cem>The Other M\u003C\u002Fem> way back in 2010, and the last \u003Cem>Metroid Prime \u003C\u002Fem>dropped  in 2007. But after all these years Samus Aran is finally back for a proper  new 3D adventure with \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fmetroid-prime-4-beyond\u002F\">Metroid Prime 4: Beyond\u003C\u002Fa>, launching this week for the Switch 2.&nbsp;\u003C\u002Fp>\u003Cp>There were a lot of bumps in the road for this one, which began   development nearly a decade ago at Namco Bandai before eventually being  shifted  back to the Nintendo studio that had developed the previous \u003Cem>Metroid Prime\u003C\u002Fem> games. But that's all in the past. The question now is whether the first \u003Cem>Metroid  Prime\u003C\u002Fem> game in 18 years can live up to the franchise's outsized  legacy.&nbsp;\u003C\u002Fp>\u003Cp>So we're taking a look back at the series, ranking most of the past \u003Cem>Metroid\u003C\u002Fem> games from worst to best by their Metascores (which represent the views of top game publications), to see  how the new \u003Cem>Metroid Prime 4\u003C\u002Fem> stacks up. A couple caveats, though: The first three \u003Cem>Metroid\u003C\u002Fem> titles—\u003Cem>Metroid \u003C\u002Fem>(NES, 1987), \u003Cem>Metroid II: Return of Samus\u003C\u002Fem> (Game Boy, 1991), and \u003Cem>Super Metroid\u003C\u002Fem>  (SNES, 1994)—aren't included in this list because they came out well  before  Metacritic existed (and thus we don't have scores for them). And  we're including remakes, remasters, and spinoffs but  not multi-game  compilations.\u003C\u002Fp>",{"id":2240,"type":1937,"title":2241,"slug":2242,"date":2243,"url":1440,"isVideo":1440,"description":2244,"tags":2245,"author":2247,"image":2248},"54fefdd6-e77d-4aff-868a-19a0d5c2e06d","Best of 2025: Game of the Year Awards Tracker","2025-video-game-awards-tracker","2025-11-17 18:10:00","Here are the games released during 2025 that have won major industry awards or received nominations for those awards.\tWe'll update our awards tracker whenever new awards and nominations are announced.",[2246],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2249,"filename":2250,"dateCreated":2251,"alt":1440,"credits":1961,"path":2253,"cropGravity":1440,"crop":1440,"caption":1961,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"a3dace55-bd8c-4927-83b0-5d9fea2999e5","gameawardstracker2025.jpg",{"date":2252,"timezone":1958},"2025-11-17 18:08:44.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F11\u002F17\u002Fa3dace55-bd8c-4927-83b0-5d9fea2999e5\u002Fgameawardstracker2025.jpg",{"id":2255,"type":1937,"title":2256,"slug":2257,"date":2258,"url":1440,"isVideo":1440,"description":2259,"tags":2260,"author":2262,"image":2263},"079bef6a-891b-4245-997a-ad0d1a96dc98","Hardware Review: ROG Xbox Ally X","reviews-for-the-asus-rog-xbox-ally-x","2025-10-15 17:45:00","This week brings a pair of handheld gaming devices aimed at Xbox gamers. But are they worth the relatively steep price?",[2261],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2264,"filename":2265,"dateCreated":2266,"alt":1440,"credits":2268,"path":2269,"cropGravity":1440,"crop":1440,"caption":1961,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"067aecbc-a3cd-4dc6-81c8-6456880ee659","rogxboxally.jpg",{"date":2267,"timezone":1958},"2025-10-14 22:55:55.000000","ROG","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F10\u002F14\u002F067aecbc-a3cd-4dc6-81c8-6456880ee659\u002Frogxboxally.jpg",{"id":2271,"type":2001,"title":2272,"slug":2273,"date":2274,"url":1440,"isVideo":1440,"description":2275,"tags":2276,"author":2278,"image":2279},"7808325b-f9d7-41c0-9dac-4f9e4eba2cd3","Every Battlefield Game, Ranked","every-battlefield-game-ranked-worst-to-best","2025-10-09 16:01:00","We rank every videogame in EA's Battlefield series (including the new Battlefield 6) from worst to best by Metascore.",[2277],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2280,"filename":2281,"dateCreated":2282,"alt":1440,"credits":2284,"path":2285,"cropGravity":1440,"crop":1440,"caption":2286,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"6c66f2b1-daf6-46e9-be9d-57039612af6c","mainbattlefield.jpg",{"date":2283,"timezone":1958},"2025-10-08 22:42:05.000000","\"Battlefield 6\" (Electronic Arts)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F10\u002F08\u002F6c66f2b1-daf6-46e9-be9d-57039612af6c\u002Fmainbattlefield.jpg","\u003Cp>There's  a very good reason the \u003Cem>Battlefield\u003C\u002Fem> franchise has stuck around for so long. The first game, \u003Cem>Battlefield 1942\u003C\u002Fem>—developed,  like most of its sequels and spinoffs, by Swedish studio  DICE—established the popularity of a pretty awesome  subgenre of online  shooter, one in which the maps are enormous and the battles  are filled  with as much vehicular combat as gun fights. The \u003Cem>Battlefield\u003C\u002Fem> series is full of shooters  for the thinking person—in this franchise, playing smart matters more than  having excellent aim.\u003C\u002Fp>\u003Cp>It's  no wonder, then, that \u003Cem>Battlefield\u003C\u002Fem> has  managed to carve itself quite a niche in the gaming market. It's why the new \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fbattlefield-6\u002F\">Battlefield 6\u003C\u002Fa>\u003Cem>,\u003C\u002Fem>  out this Friday, is one of  the most anticipated new video games of  2025. This series offers a ride you  just cannot get from any other  games. \u003C\u002Fp>\u003Cp>With \u003Cem>Battlefield 6\u003C\u002Fem> arriving this week on  PC, PS5 and Xbox  Series S\u002FX, it's the perfect time to take a look back at the   franchise's 23-year legacy—that is, how each game in the series, both  mainline entries  and spinoffs alike, have fared with reviewers on  Metacritic. For cross-platform  titles we'll be looking at the version  on the platform with the most reviews.  And we're staying with full  titles for this one—no DLC is included on the list.  So let's take a  look at the \u003Cem>Battlefield\u003C\u002Fem> games, ranked from worst to best ...\u003C\u002Fp>",{"id":2288,"type":2001,"title":2289,"slug":2290,"date":2291,"url":1440,"isVideo":1440,"description":2292,"tags":2293,"author":2295,"image":2296},"02354610-c217-4957-b397-73fa183731c5","Every Sucker Punch Productions Game, Ranked","every-sucker-punch-productions-game-ranked-worst-to-best","2025-09-26 17:40:00","We rank every video game developed by Sucker Punch Productions (including the new Ghost of Yotei) from worst to best by Metascore.",[2294],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2297,"filename":2298,"dateCreated":2299,"alt":1440,"credits":2301,"path":2302,"cropGravity":1440,"crop":1440,"caption":2303,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"9c6a831f-65b2-49b7-adbc-f7e99bd0710c","mainsuckerpunch.jpg",{"date":2300,"timezone":1958},"2025-09-26 17:09:51.000000","\"Ghost of Yōtei\" (Sony Interactive)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F09\u002F26\u002F9c6a831f-65b2-49b7-adbc-f7e99bd0710c\u002Fmainsuckerpunch.jpg","\u003Cp>Over the past  three decades, Sucker Punch Productions has been one  of gaming's most reliable  development studios, churning out hit after  hit for PlayStation for 25 years  without ever producing \u003Cem>anything\u003C\u002Fem>  that  critics have broadly disliked. Sucker Punch has as good a track  record as any  studio that's been around as long as they have. \u003C\u002Fp>\u003Cp>Over the years,  Sucker Punch has been responsible for creating three beloved PlayStation  franchises, starting with \u003Cem>Sly Cooper\u003C\u002Fem> on the PS2, \u003Cem>inFamous\u003C\u002Fem> on the PS3, and \u003Cem>Ghost of Tsushima\u003C\u002Fem>  on the PS4. That last  one proved to be Sucker Punch's biggest hit yet,  and so it only makes sense  that the company's follow-up would be a  bigger and better sequel. And that new game,  \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fghost-of-yotei\u002F\">Ghost of Yotei\u003C\u002Fa>, has already inspired a lot  of very enthusiastic reviews ahead of its launch on October 2.\u003C\u002Fp>\u003Cp>We're marking the  release of \u003Cem>Ghost of Yotei\u003C\u002Fem> by looking   back at reviews for Sucker Punch's past games, so we can see how the new  game  stacks up against the company's long history of quality titles.  Unfortunately,  we don't have enough reviews to include Sucker Punch's  very first game, \u003Cem>Rocket: Robot on Wheels\u003C\u002Fem> for the Nintendo  64, so it's not included in this list.\u003C\u002Fp>\u003Cp>Let's dive in!\u003C\u002Fp>",{"id":2305,"type":2001,"title":2306,"slug":2307,"date":2308,"url":1440,"isVideo":1440,"description":2309,"tags":2310,"author":2312,"image":2313},"d20d3298-8c11-484f-bbf9-a5a3a6896456","Every Borderlands Game, Ranked","every-borderlands-game-ranked-worst-to-best","2025-09-11 16:18:00","We rank every main and spinoff game in the Borderlands series, including the newest game, Borderlands 4.",[2311],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2314,"filename":2315,"dateCreated":2316,"alt":1440,"credits":2318,"path":2319,"cropGravity":1440,"crop":1440,"caption":2320,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"ad852186-661d-4652-bf15-cadd8b2728bd","mainborderlands.jpg",{"date":2317,"timezone":1958},"2025-09-11 16:19:48.000000","\"Borderlands 4\" (2K Games\u002FGearbox)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F09\u002F11\u002Fad852186-661d-4652-bf15-cadd8b2728bd\u002Fmainborderlands.jpg","\u003Cp>Since the first  game landed on store shelves back in 2009, the \u003Cem>Borderlands\u003C\u002Fem>  franchise has become both massively popular among  players and  massively influential in the video games industry. With its mashup  of  the shooter and RPG genres, its expansive randomized loot system, its   irreverent sense of humor, \u003Cem>and\u003C\u002Fem> the  fact that you could play the whole thing with up to three of your friends, \u003Cem>Borderlands\u003C\u002Fem> helped usher in a new era  for gaming. Many other games have borrowed the \u003Cem>Borderlands\u003C\u002Fem> blueprint over the past two decades, but in 2025 you're  only going to get the real thing from one place: \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fborderlands-4\u002F\">Borderlands 4\u003C\u002Fa>,  which arrives in digital and physical stores on  September 12 for Xbox  Series X\u002FS, PlayStation 5, and PC, and October 3 on Switch  2.\u003C\u002Fp>\u003Cp>Despite the  franchise's popularity, the folks at \u003Cem>Borderlands\u003C\u002Fem>  creator Gearbox haven't tried to exploit it by churning out yearly new  games,  or by turning its formula into a live-service affair with a  seasonal battle  pass grind the way Bungie did with \u003Cem>Destiny\u003C\u002Fem>. What it \u003Cem>has\u003C\u002Fem> done, however, is branch out with other types of games that  explore other corners of \u003Cem>Borderlands\u003C\u002Fem>'  unique sci-fi universe. So even though we're only on the fifth mainline game in  the franchise—yes, \u003Cem>Borderlands 4\u003C\u002Fem>  is  the fifth game—there have also been several spinoffs and smaller  releases that  have expanded the series in fascinating ways. \u003C\u002Fp>\u003Cp>We're marking the  launch of \u003Cem>Borderlands 4\u003C\u002Fem> by looking  back at how well the various games of the \u003Cem>Borderlands\u003C\u002Fem>  franchise have gone down with reviewers on Metacritic, including its  spinoffs  and one particularly important piece of DLC that spawned its  own little  sub-franchise. We'll be using the Metascore from the  platform receiving the most reviews for each title, and the list won't  include mobile-only  games. Let's dive in.\u003C\u002Fp>",{"id":2322,"type":2001,"title":2323,"slug":2324,"date":2325,"url":1440,"isVideo":1440,"description":2326,"tags":2327,"author":2329,"image":2330},"2ba0ab25-28ef-4d65-a537-9de070ff99ec","Every Metal Gear Video Game, Ranked","every-metal-gear-video-game-ranked-worst-to-best","2025-08-22 15:53:00","We rank every game in the Metal Gear series, including the new Metal Gear Solid Delta: Snake Eater, from worst to best by Metascore.",[2328],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2331,"filename":2332,"dateCreated":2333,"alt":1440,"credits":2335,"path":2336,"cropGravity":1440,"crop":1440,"caption":2337,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"4ff6da27-dec7-47f9-8410-697f08b24876","mainmetalgear.jpg",{"date":2334,"timezone":1958},"2025-08-21 23:01:29.000000","\"Metal Gear Solid V: The Phantom Pain\" (Konami)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F08\u002F21\u002F4ff6da27-dec7-47f9-8410-697f08b24876\u002Fmainmetalgear.jpg","\u003Cp>There aren't many video game franchises that are as well-liked or  long-running as \u003Cem>Metal Gear\u003C\u002Fem>, which made its debut on the MSX personal  computer all the way back in 1987. Since then, \u003Cem>Metal Gear\u003C\u002Fem>  and its creator Hideo  Kojima have been institutions in the gaming  space—though the franchise has  fallen off a bit in recent years since  it hasn't had a new game or re-release  since 2018. But that's about the  change with the August 28 release of \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fmetal-gear-solid-delta-snake-eater\u002F\">Metal  Gear Solid Delta: Snake Eater\u003C\u002Fa>, Konami's  modern remake of 2004's \u003Cem>Metal  Gear Solid 3\u003C\u002Fem>.&nbsp;\u003C\u002Fp>\u003Cp>The imminent arrival of \u003Cem>Metal Gear Solid Delta\u003C\u002Fem> makes this   the perfect time to look back on how critics have responded over the  years to  the many games this series has given us. Those games  have  frequently entranced  players and critics alike with their enchanting  combination of compelling  stealth gameplay and in-depth storytelling  that we rarely used to see in video  games. We have ranked just about  all of the games in franchise history below by each title's Metascore,  which represents the consensus of top professional critics on a scale of  0 (worst) to 100 (best). \u003C\u002Fp>\u003Cp>Unfortunately, we're not able to check the reviews for \u003Cem>every\u003C\u002Fem> game in the franchise, as the three earliest titles, \u003Cem>Metal Gear\u003C\u002Fem> (1987), \u003Cem>Snake's Revenge\u003C\u002Fem> (1990), and \u003Cem>Metal Gear 2: Solid Snake\u003C\u002Fem>  (1990),  came out well before Metacritic existed—and before anyone was   publishing reviews online, really. For the sake of thoroughness, we're  including most of the  different editions of each of the games, since  Konami has long been fond of  overhauling and re-releasing these games  with new features. \u003Cem>MGS Delta\u003C\u002Fem>,  for example, will be the fourth new version of \u003Cem>Snake Eater\u003C\u002Fem>, so those  updated editions are major parts of the franchise's lore. \u003C\u002Fp>\u003Cp>For games that were released on multiple platforms, the first  version released is the one eligible for this list. If the game was  released on multiple platforms simultaneously, the version receiving the  largest number of reviews from critics was eligible.  Mobile phone  games, DLC, and multi-game compilations are excluded. With that in mind,   let's dive in.\u003C\u002Fp>",{"id":2339,"type":2001,"title":2340,"slug":2341,"date":2342,"url":1440,"isVideo":1440,"description":2343,"tags":2344,"author":2346,"image":2347},"b38c3613-6450-40b9-aa14-ebe1863969aa","Every Nintendo Franchise, Ranked","every-nintendo-franchise-ranked-worst-to-best","2025-07-31 23:44:00","We rank every Nintendo game franchise in history from worst to best based on their average Metascores.",[2345],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2348,"filename":2349,"dateCreated":2350,"alt":1440,"credits":2352,"path":2353,"cropGravity":1440,"crop":1440,"caption":2354,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"44f9caf4-2ce4-4fc9-be03-b412af63343a","mainnintendofranchises.jpg",{"date":2351,"timezone":1958},"2025-07-31 23:01:07.000000","\"Mario Kart 8 Deluxe\" (Nintendo)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F07\u002F31\u002F44f9caf4-2ce4-4fc9-be03-b412af63343a\u002Fmainnintendofranchises.jpg","\u003Cp>With the wildly successful launch of the Switch 2 earlier this year,  Nintendo has once again reinforced its status as perhaps the preeminent  gaming hardware company of all time. But what has enabled that  multi-decade hardware success has been software: More than any other  console manufacturer, Nintendo has long depended on exclusive,  first-party titles to drive its hardware success, many showcasing the  creativity, playfulness, and humor that Nintendo is known for. The  result is that Nintendo has some of the most lucrative game franchises  of all time, led by its iconic Mario and  Legend of Zelda properties. \u003C\u002Fp>\u003Cp>Which of those franchises have consistently impressed game critics,  and which have failed to delight? Below, we rank every  Nintendo-published game franchise from worst to best by the average  Metascore for each franchise.\u003C\u002Fp>\u003Cp>Some notes on our methodology:\u003C\u002Fp>\u003Cul>\u003Cli>Only franchises with at least 4 scored games were eligible.\u003C\u002Fli>\u003Cli>For  the biggest franchises, like Mario, we divided them into  smaller lists of subseries (for Mario, that means separate listings for  Super Mario, Paper Mario, Mario Party, etc.).\u003C\u002Fli>\u003Cli>Though remakes and ports are included below, we excluded DLC,  most multi-game compilations, games on non-Nintendo  hardware (i.e., iOS  games),  arcade  and Game &amp; Watch games (which we don't have scores  for),  and  Japan-only releases.\u003C\u002Fli>\u003Cli>For some older pre-Metacritic titles for which we do not have  Metascores, we substituted scores from our now-defunct sister site  GameRankings, which used a similar 0-100 scoring system. (Those scores  are marked with an asterisk below.)\u003C\u002Fli>\u003Cli>Release years listed below reflect North American release dates. (Older titles were often released earlier in Japan.)\u003C\u002Fli>\u003C\u002Ful>",{"id":2356,"type":2001,"title":2357,"slug":2358,"date":2359,"url":1440,"isVideo":1440,"description":2360,"tags":2361,"author":2363,"image":2364},"0f55c948-a29e-4112-ae9d-2a425c9149f6","The Best Video Games of 2025 So Far","best-videogames-of-2025-at-midyear","2025-06-27 15:58:00","We reveal the 20 best-reviewed video games (for all platforms) released in the first half of 2025, ranked by Metascore.",[2362],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2365,"filename":2366,"dateCreated":2367,"alt":1440,"credits":2369,"path":2370,"cropGravity":1440,"crop":1440,"caption":2371,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"57adf068-e153-4768-a795-e13bac602783","2025-games-midyear-clairobscur.jpg",{"date":2368,"timezone":1958},"2025-06-27 15:59:48.000000","\"Clair Obscur: Expedition 33\" (Kepler Interactive\u002FSandfall Interactive SAS)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F06\u002F27\u002F57adf068-e153-4768-a795-e13bac602783\u002F2025-games-midyear-clairobscur.jpg","\u003Cp>Which video games  impressed critics  during the first half of the  year? On this page we rank the highest-scoring games with release dates  between January 1, 2025 and June 30, 2025. Titles are included based on  their Metascores as of June 25, 2025 and must have a \u003Cstrong>minimum of 7 reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion.\u003C\u002Fp>\u003Cp>Note that ... \u003C\u002Fp>\u003Cp>\u003Cstrong>If a game was released on multiple platforms, we included only the version receiving the largest total number of reviews\u003C\u002Fstrong> (usually, but not always, the PS5  version). \u003C\u002Fp>\u003Cp>\u003Cstrong>Newly released ports of  games released in prior years on other platforms are  excluded\u003C\u002Fstrong>,  unless they are significantly different from the prior release(s) (for  example, an HD remaster  that also adds some new content or is multiple  hardware generations beyond the previous release). \u003Cstrong>Expansions\u002FDLC, mobile games, compilations, and \"Definitive\"\u002FGOTY editions are  also ineligible\u003C\u002Fstrong>. \u003C\u002Fp>",{"id":2373,"type":1937,"title":2374,"slug":2375,"date":2376,"url":1440,"isVideo":1440,"description":2377,"tags":2378,"author":2380,"image":2381},"e20e6087-c931-4a60-9503-a8d96f5089f7","Hardware Review: Nintendo Switch 2","nintendo-switch-2-console-hardware-review","2025-06-06 15:54:00","Is Nintendo's first new console in eight years worth a purchase at its very steep price? To help you find out, we are compiling reviews of the Switch 2 console hardware itself from dozens of publications.",[2379],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2382,"filename":2383,"dateCreated":2384,"alt":1440,"credits":2386,"path":2387,"cropGravity":1440,"crop":1440,"caption":1961,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"97853ade-8583-4c28-96a9-2ef6f33d4ed5","switch2.jpg",{"date":2385,"timezone":1958},"2025-06-02 23:34:45.000000","Nintendo","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F06\u002F02\u002F97853ade-8583-4c28-96a9-2ef6f33d4ed5\u002Fswitch2.jpg",{"id":2389,"type":2001,"title":2390,"slug":2391,"date":2392,"url":1440,"isVideo":1440,"description":2393,"tags":2394,"author":2396,"image":2397},"c83c8b51-a344-4566-bf49-42355d1065a4","These Were the 20 Best Nintendo Switch Exclusives","best-nintendo-switch-exclusive-games-of-all-time","2025-05-27 18:39:00","With the pending arrival of Nintendo's Switch 2 console, we look back at the 20 best titles released exclusively for its predecessor, the original Switch.",[2395],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2398,"filename":2399,"dateCreated":2400,"alt":1440,"credits":2402,"path":2403,"cropGravity":1440,"crop":1440,"caption":2404,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"d883083d-bcee-40d8-9c54-4d5835913d4d","mainswitchexclusives.jpg",{"date":2401,"timezone":1958},"2025-05-27 18:40:33.000000","\"Super Mario Odyssey\" (Nintendo)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F05\u002F27\u002Fd883083d-bcee-40d8-9c54-4d5835913d4d\u002Fmainswitchexclusives.jpg","\u003Cp>Coming off  the \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fbrowse\u002Fgame\u002Fwii-u\u002Fall\u002Fall-time\u002Fmetascore\u002F?releaseYearMin=1958&amp;releaseYearMax=2025&amp;platform=wii-u&amp;page=1\">disappointing Wii U era\u003C\u002Fa>,  Nintendo needed a win in a big way—and it got it  with the Switch  console, which has become Nintendo's best-selling piece of  hardware \u003Cem>ever\u003C\u002Fem>.  But after eight  years the reign of the Nintendo Switch is coming to an  end as the company  prepares to launch its successor, the Switch 2, in  early June. So now is the right time to reflect  on the games that  helped make the Nintendo Switch such a massive success.\u003C\u002Fp>\u003Cp>While it  would be easy to simply credit the Switch's success to its  unique form factor—that it works both as a console for your living room  and as a portable you can  take with you—it's the system's \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fbrowse\u002Fgame\u002Fnintendo-switch\u002Fall\u002Fall-time\u002Fmetascore\u002F?releaseYearMin=1958&amp;releaseYearMax=2025&amp;platform=nintendo-switch&amp;page=1\">strong lineup of games\u003C\u002Fa>,  in particular its  exclusives, that put the Switch over the top. So  let's look back at the  20  best  Nintendo Switch exclusive games from  that console's lifetime, as ranked by Metascore  (representing the  consensus views of top game publications on a 0-100 scale). Note that  only games with at least  seven reviews were eligible for inclusion  here.\u003C\u002Fp>",{"id":2406,"type":2001,"title":2407,"slug":2408,"date":2409,"url":1440,"isVideo":1440,"description":2410,"tags":2411,"author":2413,"image":2414},"be9e7a35-b52b-4d44-a969-87b076bed952","Every Assassin's Creed Game, Ranked","every-assassins-creed-game-ranked-worst-to-best","2025-03-18 17:02:00","We rank every game in the Assassin's Creed franchise—including this week's new game Assassin's Creed Shadows—from worst to best based on Metascore.",[2412],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2415,"filename":2416,"dateCreated":2417,"alt":1440,"credits":2419,"path":2420,"cropGravity":1440,"crop":1440,"caption":2421,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"4849f134-36d7-4c75-920c-c3d9829e88af","mainassassinscreedgames.jpg",{"date":2418,"timezone":1958},"2025-03-17 22:40:23.000000","\"Assassin's Creed Mirage\" (Ubisoft)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F03\u002F17\u002F4849f134-36d7-4c75-920c-c3d9829e88af\u002Fmainassassinscreedgames.jpg","\u003Cp>Since it  originally launched  in 2007, the \u003Cem>Assassin's  Creed\u003C\u002Fem>  franchise has become a gaming institution, with more than a dozen   mainline titles in the series along with a big pile of spinoffs, mobile  titles,  novels, comic books, and even a \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fmovie\u002Fassassins-creed\u002F\">live-action movie\u003C\u002Fa> starring Michael Fassbender.  It was \u003Cem>Assassin's Creed\u003C\u002Fem>  that proved  to the  gaming industry that historical action games could  sell just as  well as fantasy or sci-fi titles, paving the way for  recent hits like \u003Cem>Ghost of Tsushima\u003C\u002Fem> and \u003Cem>Kingdom Come: Deliverance 2\u003C\u002Fem>.\u003C\u002Fp>\u003Cp>But it's not  as though \u003Cem>Assassin's Creed\u003C\u002Fem> is an  also-ran. Ubisoft's flagship series lives on in 2025 with \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fassassins-creed-shadows\u002F\">Assassin's Creed Shadows\u003C\u002Fa>, the 14th mainline title in the series. \u003Cem>Shadows\u003C\u002Fem>  takes players through a new story in the never-ending conflict  between  the Assassin Brotherhood and the Templar Order in 16th century Japan. \u003C\u002Fp>\u003Cp>As we gear up for the franchise's latest adventure across time, let's take a  look back at how well that title and past \u003Cem>Assassin's Creed\u003C\u002Fem>  games have fared with critics.  Below you'll find all 14 mainline  titles ranked by Metascore, starting with the  worst-reviewed game and  working our way up to the best.\u003C\u002Fp>\u003Cp>\u003Cem>Note that we are only ranking  the  original releases for mainline \u003C\u002Fem>Assassin's Creed\u003Cem> titles. Spinoffs, remasters, or games that are exclusive  to mobile or VR are excluded. Since every mainline \u003C\u002Fem>Assassin's Creed\u003Cem> game is a multiplatform affair, we'll be using the Metascore for the  platform with the most critic reviews for each title.\u003C\u002Fem>\u003C\u002Fp>",{"id":2423,"type":2001,"title":2424,"slug":2425,"date":2426,"url":1440,"isVideo":1440,"description":2427,"tags":2428,"author":2430,"image":2431},"5c684b37-4c0d-427d-999c-90f851e7a6dd","Metacritic's 15th Annual Game Publisher Rankings","2025-game-publisher-rankings","2025-03-05 16:00:00","We reveal the past year's best and worst video game publishers (based on their 2024 releases) in the 15th edition of our annual Game Publisher Rankings.",[2429],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2432,"filename":2433,"dateCreated":2434,"alt":1440,"credits":1440,"path":2436,"cropGravity":1440,"crop":1440,"caption":2437,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"51b7aabb-1c36-4598-9586-3c985689a5e4","landinggamepublisherrankings2025rev.jpg",{"date":2435,"timezone":1958},"2025-03-05 00:14:23.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F03\u002F05\u002F51b7aabb-1c36-4598-9586-3c985689a5e4\u002Flandinggamepublisherrankings2025rev.jpg","\u003Cp>Which game publishers released the best games in 2024?  For the 15th  consecutive year, we  sifted through 12 months of  data to determine the  best and worst game publishers of the year, based solely on the quality  of their 2024 releases. Sales and user reviews do not factor into these  rankings; only critic reviews (as captured by each game's Metascore)  are used to evaluate performance. \u003C\u002Fp>\u003Cp>Publishers are ranked from worst to best in the gallery below  based on a points system, calculated (as in previous years) according to  the following four factors:\u003C\u002Fp>\u003Cp>(1) Average Metascore for all  games released in 2024\u003Cbr>       \u003Cem>150 possible points (awarded at 1.5 x the average Metascore)\u003C\u002Fem>\u003C\u002Fp>\u003Cp>(2) % of scored products with good reviews (Metascore of at least \u003Cspan class=\"fmsgreen\" data-shortcode=\"textscore\" data-score=\"75\" data-classnames=\"o-inlineScore-green\">75\u003C\u002Fspan>)\u003Cbr>       \u003Cem>100 possible points (ex: 80% good = 80 points)\u003C\u002Fem>\u003C\u002Fp>\u003Cp>(3) % of scored products with bad reviews (\u003Cspan class=\"fmsred\" data-shortcode=\"textscore\" data-score=\"49\" data-classnames=\"o-inlineScore-red\">49\u003C\u002Fspan> or lower; in this case, a lower % is better)\u003Cbr>       \u003Cem>100 possible points (ex: 20% bad = 80 points)\u003C\u002Fem>\u003C\u002Fp>\u003Cp>(4) Number of \"great\" titles (Metascore of  \u003Cspan class=\"fmsgreen\" data-shortcode=\"textscore\" data-score=\"90\" data-classnames=\"o-inlineScore-green\">90\u003C\u002Fspan> or higher, min. 7 reviews)\u003Cbr>       \u003Cem>Awarded as 5 bonus points for each distinct title with a 90+ score\u003C\u002Fem>\u003C\u002Fp>\u003Cp>As you can see above,  the  Metascore average (the first factor) counts slightly more than the other factors. \u003Cstrong>Only publishers with five or more distinct titles released last year are included in our rankings. \u003C\u002Fstrong>For fans of fine print, additional notes on our methodology appear at the bottom of this page.\u003C\u002Fp>",{"id":2439,"type":2001,"title":2440,"slug":2441,"date":2442,"url":1440,"isVideo":1440,"description":2443,"tags":2444,"author":2446,"image":2447},"24fd2873-4515-46fb-9d03-dd2b282298ef","Every Like a Dragon\u002FYakuza Game, Ranked","every-like-a-dragon-yakuza-game-ranked","2025-02-18 16:42:00","(Updated February 2026) We rank every English-language release in the Like a Dragon [aka Yakuza] videogame series from worst to best by Metascore.",[2445],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2008,"id":2009,"lastName":2010,"username":2011},{"id":2448,"filename":2449,"dateCreated":2450,"alt":1440,"credits":2452,"path":2453,"cropGravity":1440,"crop":1440,"caption":2454,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"c2db7015-f36f-4c0b-868b-8d7f93a2175a","mainlikeadragongames.jpg",{"date":2451,"timezone":1958},"2025-02-14 23:58:56.000000","\"Like a Dragon: Pirate Yakuza in Hawaii\" (Sega)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F02\u002F14\u002Fc2db7015-f36f-4c0b-868b-8d7f93a2175a\u002Fmainlikeadragongames.jpg","\u003Cp>The \u003Cem>Yakuza\u003C\u002Fem> video game series used to be very  niche. These  were games that, in the early years of the franchise, did well in   Japan, but didn't make a huge impression in the West. But that has   changed in a  very big way in  recent years. Sega has put more effort  into localizing  these games, and players have responded by turning \u003Cem>Yakuza\u003C\u002Fem>—later renamed \u003Cem>Like a Dragon\u003C\u002Fem>  in the West to match its Japanese title—into a celebrated  modern  franchise, culminating in the outlandish new entry in the series, \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Flike-a-dragon-pirate-yakuza-in-hawaii\u002F\">Like a Dragon: Pirate Yakuza in Hawaii\u003C\u002Fa>.\u003C\u002Fp>\u003Cp>As you'd  expect from a title like \"Yakuza,\"  these games are  sprawling and melodramatic single-player Japanese crime dramas  in which  you'll have to unravel some big mystery or conspiracy that involves   somebody—usually a rival clan, rivals in your own clan, or government   agents—getting overly ambitious and making a major power play. And your  character,  typically  a gangster with a heart of gold, is the only one  who can  stop whatever it is. \u003C\u002Fp>\u003Cp>But it's  really not the melodrama that's kept people playing the  Yakuza series all these  years. On top of the main plot, the big appeal  of the franchise is that when  you're in between story beats, you get to  hang out in Japan. These are open  world games that provide access to a  number of different locations  where you can just go to bars and  restaurants, go on dates, play arcade games,  get mugged, engage in  random hijinks with strangers, and so much more. You don't  just play  these games—you kinda live in 'em. \u003C\u002Fp>\u003Cp>Right now,  we're celebrating this week's arrival of \u003Cem> \u003C\u002Fem> \u003Cem>Like a Dragon: Pirate Yakuza in  Hawaii\u003C\u002Fem>   by looking back on this lengthy franchise and ranking every key   entry, by Metascore, from worst to best. Note that if a title was  released on multiple  platforms, \u003Cstrong>only the version receiving  the highest quantity of reviews from professional critics\u003C\u002Fstrong>  was eligible for  inclusion. We have included major remakes as well as  spinoffs set in the same  world but excluded any titles that were never  released in North America.\u003C\u002Fp>",{"id":2456,"type":2001,"title":2457,"slug":2458,"date":2459,"url":1440,"isVideo":1440,"description":2460,"tags":2461,"author":2463,"image":2464},"d77c6f46-e8e3-4023-af1b-b7990ac137b6","Every Civilization Game, Ranked","every-sid-meiers-civilization-game-ranked","2025-02-05 01:18:00","Itching to play just one more turn? With this week's arrival of Civilization 7, we rank every release in the Sid Meier's Civilization turn-based strategy game franchise (including spin-offs) from worst to best by Metascore.",[2462],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2465,"filename":2466,"dateCreated":2467,"alt":1440,"credits":2469,"path":2470,"cropGravity":1440,"crop":1440,"caption":2471,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"8c8fe97c-cdda-4e07-8d21-5834c5dbae69","maincivilizationgamesranked.jpg",{"date":2468,"timezone":1958},"2025-02-05 00:48:41.000000","Gilgamesh will remember this. (\"Civilization VI,\" Firaxis Games\u002F2K Games)","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F02\u002F05\u002F8c8fe97c-cdda-4e07-8d21-5834c5dbae69\u002Fmaincivilizationgamesranked.jpg","\u003Cp>No game franchise triggers the \"just one more turn\" syndrome more than  Sid Meier's \u003Cem>Civilization\u003C\u002Fem>—in  fact, that phrase is even baked right into recent entries in the  series. Though not the first turn-based, 4X (\"eXplore\" \u002F \"eXpand\" \u002F  \"eXploit\" \u002F \"eXterminate\") strategy franchise to arrive on the market,  1991's \u003Cem>Civilization\u003C\u002Fem> and its  successors quickly established themselves as the 4X games against which all others are measured, thanks to \u003Cem>Civ\u003C\u002Fem>'s hugely addictive gameplay loop and depth. \u003C\u002Fp>\u003Cp>That franchise expands this week with the arrival of \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fsid-meiers-civilization-vii\u002F\">Civilization VII\u003C\u002Fa>,  the first all-new entry in the series in nearly a decade. How does it  stack up to the previous titles in a series that has sold more than 70  million units and frequently ranks among the greatest game franchises of  all time? To find out, we have ranked every \u003Cem>Civilization\u003C\u002Fem> game  from worst to best. Those rankings are determined by each game's  Metascore, a number from 0-100 that represents the overall consensus  from the most respected game publications and professional critics. \u003C\u002Fp>\u003Cp>Unfortunately, the original \u003Cem>Civilization\u003C\u002Fem> game is excluded  from our list, as its 1991 release date (which predates both Metacritic  and its one-time sister site GameRankings) means that we don't have  enough reviews available to allow us to calculate a score. That game,  developed by Sid Meier and his then-company MicroProse and loosely  inspired by a 1980 Avalon Hill board game of the same name, established  the basic gameplay template for the series—including the then-novel  technology tree and an epic scope that spans millennia—that persists to  this day, even if the implementation and complexity have changed  considerably. And Meier's name has been included as part of the official  title of nearly every release, with most subsequent games developed by  the Meier-founded studio Firaxis (now owned by Take-Two Interactive). \u003C\u002Fp>\u003Cp>\u003Cstrong>Each title is only included once below even if was released for multiple platforms. \u003C\u002Fstrong>Unless  otherwise indicated, only  the original PC version of each game was  eligible to be ranked here (though many of the titles were later ported  to consoles). The exception is games released only on consoles, in which  case the version receiving the highest quantity of critic reviews is  the one included below. \u003Cstrong>In addition to the main numbered series, we have also included spin-off games\u003C\u002Fstrong> (with the exceptions of 1994's \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fsid-meiers-colonization\u002F\">Sid Meier's Colonization\u003C\u002Fa>, 1999's \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fcivilization-call-to-power\u002F\">Civilization: Call to Power\u003C\u002Fa>, and the 2011 Facebook game \u003Cem>Civilization World\u003C\u002Fem>, for which no reviews are available) \u003Cstrong>but not DLC expansions\u003C\u002Fstrong>.\u003C\u002Fp>",{"id":2473,"type":2001,"title":2474,"slug":2475,"date":2476,"url":1440,"isVideo":1440,"description":2477,"tags":2478,"author":2480,"image":2481},"93715289-8f02-41e2-a6c6-2384751d0e4f","The 20 Best PlayStation Games of 2024","best-playstation-games-of-2024","2025-01-03 17:24:00","We rank the highest-scoring new PlayStation games released in 2024.",[2479],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2482,"filename":2483,"dateCreated":2484,"alt":1440,"credits":1440,"path":2486,"cropGravity":1440,"crop":1440,"caption":2487,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"fd17bd10-2a60-4383-b918-17e5d91d67ad","mainbestgames2024playstation.jpg",{"date":2485,"timezone":1958},"2025-01-03 00:28:30.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F01\u002F03\u002Ffd17bd10-2a60-4383-b918-17e5d91d67ad\u002Fmainbestgames2024playstation.jpg","\u003Cp>Which PlayStation games  impressed professional reviewers the most  during the past year? This page  contains Metacritic's official list of  the 20 best-reviewed titles released for PS5  or PS4 between January 1,  2024 and December 31, 2024 ranked by Metascore. Games \u003Cstrong>must have at least 7 scored reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion. \u003C\u002Fp>\u003Cp>If a game appears on both PlayStation platforms, only the version  receiving the higher quantity of critic reviews (typically the PS5  version) was eligible. \u003C\u002Fp>",{"id":2489,"type":2001,"title":2490,"slug":2491,"date":2492,"url":1440,"isVideo":1440,"description":2493,"tags":2494,"author":2496,"image":2497},"26b19460-8aa5-41e3-8158-cf3e063801b6","The 20 Best Xbox Games of 2024","best-xbox-games-of-2024","2025-01-02 19:24:00","We rank the highest-scoring new Xbox games released in 2024.",[2495],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2498,"filename":2499,"dateCreated":2500,"alt":1440,"credits":1961,"path":2502,"cropGravity":1440,"crop":1440,"caption":2503,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"bff8f056-c45d-4f31-9847-f510c18185fd","mainbestgames2024xbox.jpg",{"date":2501,"timezone":1958},"2025-01-02 19:08:59.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F01\u002F02\u002Fbff8f056-c45d-4f31-9847-f510c18185fd\u002Fmainbestgames2024xbox.jpg","\u003Cp>Which Xbox games  impressed professional reviewers the most during  the past year? This page  contains Metacritic's official list of the 20  best-reviewed titles released for Xbox Series X\u002FS  or Xbox One between  January 1, 2024 and December 31, 2024 ranked by Metascore. Games \u003Cstrong>must have at least 7 scored reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion. \u003C\u002Fp>\u003Cp>If a game appears on both Xbox platforms, only the version  receiving the higher quantity of critic reviews (typically the Xbox  Series X\u002FS version) was eligible. \u003C\u002Fp>",{"id":2505,"type":2001,"title":2506,"slug":2507,"date":2508,"url":1440,"isVideo":1440,"description":2509,"tags":2510,"author":2512,"image":2513},"7eedf76b-49d1-4269-9049-94e505f65ea0","The 20 Best PC Games of 2024","best-pc-games-of-2024","2025-01-01 00:15:00","We rank the highest-scoring new PC games released in 2024.",[2511],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2514,"filename":2515," ar? This page  contains Metacritic's official  list of the 20 best-reviewed titles released for the Switch between  January 1, 2024 and December 31, 2024 ranked by Metascore. Games \u003Cstrong>must have at least 7 reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion.\t\u003C\u002Fp>",{"id":2537,"type":2001,"title":2538,"slug":2539,"date":2540,"url":1440,"isVideo":1440,"description":2541,"tags":2542,"author":2544,"image":2545},"24c281df-bbb7-45af-86ed-91c736b25c8a","The Worst Video Games of 2024","worst-video-games-of-2024","2024-12-17 22:11:00","Here are Metacritic's lowest-scoring video games released in 2024.",[2543],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2546,"filename":2547,"dateCreated":2548,"alt":1440,"credits":1440,"path":2550,"cropGravity":1440,"crop":1440,"caption":2551,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"4aeb66a3-ae54-4b34-a0bf-f5b3b766b3a1","mainworstgamesof2024.jpg",{"date":2549,"timezone":1958},"2024-12-17 22:12:59.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F12\u002F17\u002F4aeb66a3-ae54-4b34-a0bf-f5b3b766b3a1\u002Fmainworstgamesof2024.jpg","\u003Cp>On this page we rank the  lowest-scoring games released for any  platform between January 1, 2024 and December 31, 2024 in North America.  \u003C\u002Fp>\u003Cp>Because we require 4  reviews from professional critics to calculate  a Metascore, any titles with fewer than 4 reviews  are excluded. (For  our \u003Cstrong>best\u003C\u002Fstrong> lists, we have a higher cutoff, but we think  relaxing the requirements here makes for a more fun worst list. We also  opened the list up to mobile and VR releases, DLC, and compilations.)  And if a single title would have landed on the list multiple times due  to low scores on more than one platform, we only included the  lowest-scoring version.\u003C\u002Fp>",{"id":2553,"type":1937,"title":2554,"slug":2555,"date":2556,"url":1440,"isVideo":1440,"description":2557,"tags":2558,"author":2560,"image":2561},"10a3857b-59dd-4fb3-9f5f-c5cde090ae54","Best of 2024: Game of the Year Awards Tracker","2024-game-of-the-year-awards-tracker","2024-11-19 22:38:00","Here are the games released during 2024 that have won major industry awards or received nominations for those awards. We'll update our awards tracker whenever new awards and nominations are announced.",[2559],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2562,"filename":2563,"dateCreated":2564,"alt":1440,"credits":1961,"path":2566,"cropGravity":1440,"crop":1440,"caption":1961,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"aa13a3d7-4cf9-4fe4-a2ef-796b6664b8a4","gameawardstracker2024.jpg",{"date":2565,"timezone":1958},"2024-11-19 22:37:56.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F11\u002F19\u002Faa13a3d7-4cf9-4fe4-a2ef-796b6664b8a4\u002Fgameawardstracker2024.jpg",{"id":2568,"type":1937,"title":2569,"slug":2570,"date":2571,"url":1440,"isVideo":1440,"description":2572,"tags":2573,"author":2575,"image":2576},"95a8f317-a762-4a67-8160-42424634b62d","Hardware Review: PlayStation 5 Pro","playstation-5-pro-console-review-roundup","2024-11-06 17:41:00","Sony's newest version of the PlayStation 5 console is a \"Pro\" model that promises greatly improved visuals thanks to hardware and software enhancements. But do the improvements justify its nearly $700 cost? Find out what critics are saying about the PS5 Pro.",[2574],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2577,"filename":2578,"dateCreated":2579,"alt":1440,"credits":2581,"path":2582,"cropGravity":1440,"crop":1440,"caption":1961,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"23f5ad73-0023-45c4-a756-fd1a3f6adf22","playstation5proconsole.jpg",{"date":2580,"timezone":1958},"2024-11-01 23:26:34.000000","Sony Interactive Entertainment","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F11\u002F01\u002F23f5ad73-0023-45c4-a756-fd1a3f6adf22\u002Fplaystation5proconsole.jpg",{"id":2584,"type":2001,"title":2585,"slug":2586,"date":2587,"url":1440,"isVideo":1440,"description":2588,"tags":2589,"author":2591,"image":2596},"adb809c3-4019-4664-9569-4e8c80a6151c","The 20 Best Original Games of the 21st Century","best-original-games-of-the-21st-century","2024-11-05 22:27:00","We rank the highest-scoring \"original\" games (that aren't sequels or remakes or based on existing IP) released since January 1, 2000.",[2590],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2592,"id":2593,"lastName":2594,"username":2595},"Nick","7974d639-0d7a-4f9d-bc19-92d8e0ac3199","Hyman","nickhyman",{"id":2597,"filename":2598,"dateCreated":2599,"alt":1440,"credits":2601,"path":2602,"cropGravity":1440,"crop":1440,"caption":2603,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"316e1b05-16c9-4054-a80c-f04b548e019a","mainbestoriginalgames.jpg",{"date":2600,"timezone":1958},"2024-11-05 22:28:28.000000","FromSoftware\u002FBandai Namco\u002FMetacritic","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F11\u002F05\u002F316e1b05-16c9-4054-a80c-f04b548e019a\u002Fmainbestoriginalgames.jpg","\u003Cp>\u003Cem>They aren't sequels. They aren't spinoffs. They aren't remakes.  They aren't based on any pre-existing IP. Yes, it's true: The video game  industry sometimes produces completely original games. Below, we reveal  the very best of these original games released since January 1, 2000 as  ranked by their Metascores, a number from 0 to 100 that represents the  overall views of top professional game critics. (The higher the number,  the better the reviews.) \u003C\u002Fem>\u003C\u002Fp>\u003Cp>\u003Cem>Note that if a title was released on multiple platforms at  roughly the same time, only the version receiving the highest quantity  of reviews was eligible for inclusion. And if a game was later ported to  one or more additional consoles, only the first release was eligible.\u003C\u002Fem>\u003C\u002Fp>",{"id":2605,"type":2001,"title":2606,"slug":2607,"date":2608,"url":1440,"isVideo":1440,"description":2609,"tags":2610,"author":2612,"image":2613},"da7f5062-7c30-42e8-ab10-a5cb400cda12","Every Silent Hill Game, Ranked","every-silent-hill-game-ranked-worst-to-best","2024-10-04 15:40:00","(Updated September 2025) We rank every video game in Konami's Silent Hill franchise from worst to best by Metascore.",[2611],{"id":1944,"name":1945,"slug":1946},{"byline":1440,"firstName":2592,"id":2593,"lastName":2594,"username":2595},{"id":2614,"filename":2615,"dateCreated":2616,"alt":1440,"credits":2618,"path":2619,"cropGravity":1440,"crop":1440,"caption":2620,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"68798557-b481-4653-9506-cb11a232de0b","mainsilenthillgamesrankedrev.jpg",{"date":2617,"timezone":1958},"2025-09-22 17:54:42.000000","Konami \u002F Metacritic","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2025\u002F09\u002F22\u002F68798557-b481-4653-9506-cb11a232de0b\u002Fmainsilenthillgamesrankedrev.jpg","\u003Cp>When you hear the term \"survival horror\" in the video game  realm, \u003Cem>Resident Evil \u003C\u002Fem>and \u003Cem>Silent Hill \u003C\u002Fem>are likely the first two  franchises that come to mind. Throughout the years the Konami-developed \u003Cem>Silent Hill\u003C\u002Fem>  series, which started as atmospheric small-town mysteries that get  increasingly freaky  as you progress, has mutated outside of just games  with two movies (\u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fmovie\u002Fsilent-hill\u002F\">Silent Hill\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fmovie\u002Fsilent-hill-revelation-3d\u002F\">Silent  Hill: Revelation\u003C\u002Fa>), books, pachinko machines, and even an appearance of the  dreaded Pyramid Head in the newly released \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Fastro-bot\u002F\">Astro Bot\u003C\u002Fa>. \u003C\u002Fp>\u003Cp>This month,  the franchise  is celebrating 25 years with a remake of one of the more  acclaimed titles in the series, \u003Cem>Silent Hill 2\u003C\u002Fem>. To celebrate that game's arrival, let's turn the  lights off and take a mysterious journey through the \u003Cem>Silent Hill\u003C\u002Fem>  video  game series as we rank each entry based on their Metascores,  representing the critical reaction to the games upon initial release   (with higher numbers on our 0-100 scale equating to better overall   reviews from top professional critics).&nbsp;\u003C\u002Fp>\u003Cp>Smartphone games, multi-game compilations, and repackages of existing  games (such as \"Director's Cut\" editions) have been excluded from the  list. And note that when a game has been released on multiple platforms,  we are only including the score for the platform that received the  largest quantity of reviews from professional critics. \u003C\u002Fp>",{"id":2622,"type":2001,"title":2623,"slug":2624,"date":2625,"url":1440,"isVideo":1440,"description":2626,"tags":2627,"author":2629,"image":2630},"9264e137-127f-41e1-a040-a7e59d58dfb1","The Best Video Games of 2024 So Far","best-video-games-of-2024-at-midyear","2024-06-27 15:47:00","We rank the highest-scoring new video games released during the first half of 2024.",[2628],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2631,"filename":2632,"dateCreated":2633,"alt":1440,"credits":2635,"path":2636,"cropGravity":1440,"crop":1440,"caption":2637,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"8a6d4853-10d9-4cdb-abea-8893c6635d30","mainbestgames2024midyear.jpg",{"date":2634,"timezone":1958},"2024-06-27 15:47:21.000000","Square Enix \u002F Metacritic","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F06\u002F27\u002F8a6d4853-10d9-4cdb-abea-8893c6635d30\u002Fmainbestgames2024midyear.jpg","\u003Cp>Which videogames  impressed critics  during the first half of the  year? On this page we rank the highest-scoring games with release dates  between January 1, 2024 and June 30, 2024. Titles are included based on  their Metascores as of June 26, 2024 and must have a \u003Cstrong>minimum of 7 reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion.\u003C\u002Fp>\u003Cp>Note that ... \u003C\u002Fp>\u003Cp>\u003Cstrong>If a game was released on multiple platforms, we included only the version receiving the largest total number of reviews\u003C\u002Fstrong> (usually, but not always, the PS5 or PS4 version). \u003C\u002Fp>\u003Cp>\u003Cstrong>Multi-game compilations and newly released ports of  games released in recent years on other platforms are  excluded\u003C\u002Fstrong>,  unless they are substantially different from the prior release(s) (for  example, an HD remaster  that also adds some new content or is multiple  hardware generations beyond the previous release). \u003Cstrong>Mobile games, \"Definitive\"\u002FGOTY editions, and expansions\u002FDLC are  also ineligible\u003C\u002Fstrong>. (Yes, that means you won't find \u003Ca href=\"https:\u002F\u002Fwww.metacritic.com\u002Fgame\u002Felden-ring-shadow-of-the-erdtree\u002F\">Shadow of the Erdtree\u003C\u002Fa> here.)\u003C\u002Fp>",{"id":2639,"type":2001,"title":2640,"slug":2641,"date":2642,"url":1440,"isVideo":1440,"description":2643,"tags":2644,"author":2646,"image":2647},"5049c2c8-77ee-42a8-b0b3-12ba41157406","Every Metacritic Game of the Year Winner","every-metacritic-game-of-the-year-winner","2024-06-11 00:00:00","(Updated January 2026) These are the best-reviewed games released each year in the 21st century.",[2645],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2648,"filename":2649,"dateCreated":2650,"alt":1440,"credits":2652,"path":2653,"cropGravity":1440,"crop":1440,"caption":2654,"typeName":1440,"imageUrl":1440,"width":1962,"height":1963,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"2f578434-0805-461f-abbc-e65995e261dd","landinggameoftheyearwinners.jpg",{"date":2651,"timezone":1958},"2024-06-10 23:35:49.000000","Metacritic \u002F Rockstar Games","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F06\u002F10\u002F2f578434-0805-461f-abbc-e65995e261dd\u002Flandinggameoftheyearwinners.jpg","\u003Cp>What were the best-reviewed games in every year in the 21st century?  Below are each of Metacritic's Game of the Year honorees for every year  since our launch in 2000, listed in reverse chronological order.\u003C\u002Fp>\u003Cp>What makes a game  a Metacritic Game of the Year recipient?  Basically, that title is given to the highest-scoring new game released  in each calendar year, with these qualifications:\u003C\u002Fp>\u003Cul>\u003Cli>The Game of the Year recipient has the highest Metascore (a number  from 0-100 representing the consensus opinion of top game review  publications), prior to rounding, for all games released in a calendar  year.\u003C\u002Fli>\u003Cli>Games \u003Cstrong>must have at least 7 reviews\u003C\u002Fstrong> from professional critics to be eligible for inclusion\u003C\u002Fli>\u003Cli>\u003Cstrong>For titles released  on multiple platforms, only the version receiving the largest total number of reviews is eligible\u003C\u002Fstrong>.\u003C\u002Fli>\u003Cli>It must be a \"new\" game: If the same title was released the  previous year for other platforms, it does not qualify again in the  second year (each title can only be eligible in its first year).  However, remakes\u002Fremasters\u002Fports are considered  \"new\" games if there  are significant changes in the new version. (There's no hard and fast  rule about what \"significant\" means here, but generally we're looking  for a decent amount of new playable content rather than mere cosmetic  upgrades.)\u003C\u002Fli>\u003Cli>Multi-game compilations, expansion packs\u002FDLC, and Definitive\u002FGOTY editions are  ineligible.\u003C\u002Fli>\u003Cli>Mobile games are also ineligible.\u003C\u002Fli>\u003C\u002Ful>",{"id":2656,"type":1937,"title":2657,"slug":2658,"date":2659,"url":1440,"isVideo":1440,"description":2660,"tags":2661,"author":2663,"image":2664},"444c919e-80a7-4e09-b126-265787c3061d","Metacritic's 14th Annual Game Publisher Rankings","2024-game-publisher-rankings","2024-03-21 13:00:00","We reveal the past year's best and worst video game publishers (based on their 2023 releases) in the 14th edition of our annual Game Publisher Rankings.",[2662],{"id":1944,"name":1945,"slug":1946},{"byline":1948,"firstName":1949,"id":1950,"lastName":1951,"username":1952},{"id":2665,"filename":2666,"dateCreated":2667,"alt":1440,"credits":1961,"path":2669,"cropGravity":1440,"crop":1440,"caption":1961,"typeName":1440,"imageUrl":1440,"width":1980,"height":1981,"sType":1440,"bucketType":1440,"bucketPath":1440,"mediaType":1440},"1e650cbb-7e95-4b1c-bc4c-ee1b379fb582","maingamepublishers2024.jpg",{"date":2668,"timezone":1958},"2024-03-20 23:36:10.000000","https:\u002F\u002Fwww.metacritic.com\u002Fa\u002Fimg\u002F2024\u002F03\u002F20\u002F1e650cbb-7e95-4b1c-bc4c-ee1b379fb582\u002Fmaingamepublishers2024.jpg",{"id":2671,"type":2001,"title":2672,"slug":2673,"date":2674,"url":1440,"isVideo":1440,"description":2675,"tags":2676,"author":2678,"image":2679},"e6f7765e-2bb5-44dd-b04c-e950c6718706","The 20 Best PC Games of 2023","best-pc-games-of-2023","2024-01-03 08:00:00","We rank the highe
